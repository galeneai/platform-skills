    SetApplicationAvailabilityRequest:
      properties:
        tenant_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Tenant Id
          description: Tenant the rule applies to. Omit or send `null` for the global rule that applies
            to every tenant without a tenant-specific rule for the same version.
          examples:
          - 5f0c8a52-7d3e-4b1a-9c2e-000000000001
        version_id:
          type: string
          format: uuid
          title: Version Id
          description: Version of this package the rule applies to.
          examples:
          - 5f0c8a52-7d3e-4b1a-9c2e-000000000011
        status:
          $ref: '#/components/schemas/ApplicationAvailabilityStatus'
          description: '`available` (default) lets the tenant install or upgrade to the version; `suspended`
            and `revoked` block new installations and upgrades to it. Existing deployments are not changed.'
          default: available
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
          description: Optional operator note stored with the rule; the previous note is replaced.
          examples:
          - Paused while the customer reviews the data processing terms.
      type: object
      required:
      - version_id
      title: SetApplicationAvailabilityRequest
      description: Make one package version available (or not) to one tenant or to every tenant.
      examples:
      - status: available
        tenant_id: null
        version_id: 5f0c8a52-7d3e-4b1a-9c2e-000000000011
      - notes: Paused while the customer reviews the data processing terms.
        status: suspended
        tenant_id: 5f0c8a52-7d3e-4b1a-9c2e-000000000001
        version_id: 5f0c8a52-7d3e-4b1a-9c2e-000000000011
