  /controlplane/registry-sources/{source_id}/verify:
    post:
      tags:
      - Control Plane Registry Sources
      summary: Verify a registry source
      description: 'Check that the platform can authenticate to the registry with the stored credential,
        and record the result on the source (`verification_status`, `verification_message`, `verified_at`).


        Requires a control-plane access token or API key with the `controlplane.registry_sources.manage`
        permission (roles `controlplane_admin` and `controlplane_app_publisher`; control-plane API keys
        always have it).


        The call contacts the registry synchronously over HTTPS (10-second timeouts, no redirects), trusting
        the stored CA bundle when there is one. `GET /v2/` must answer 401 with an authentication challenge.
        For `Basic` registries the credential must then be accepted by `/v2/` and `/v2/_catalog`. For
        `Bearer` registries the token realm must be the endpoint origin or listed in `token_realm_allowlist`,
        the token must grant `pull` on the probe repository (`verification_repository`, or the platform''s
        own probe repository for the internal source) and a manifest lookup there must return 200 or 404.
        The internal source''s generated credential only works once the application controller has applied
        it (`credentials_ready`).


        A failed check returns 422 and leaves the source `failed`.'
      operationId: verify_controlplane_registry_sources__source_id__verify_post
      parameters:
      - name: source_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Id of the registry source.
          title: Source Id
        description: Id of the registry source.
      responses:
