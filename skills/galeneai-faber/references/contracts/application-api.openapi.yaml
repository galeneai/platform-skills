    post:
      tags:
      - Tenant Applications
      summary: Install an application
      description: 'Install an application package version for the tenant, or reinstall a package whose
        previous deployment is `uninstalled` (the deployment id is reused and its permission bindings
        start over).


        Requires the `application.install` permission.


        The call validates the environment values, capabilities, model selections and permission bindings
        against the version''s manifest; stores sensitive values in the secret store; provisions the approved
        capabilities and the databases declared by the manifest; creates the tenant permissions `app.<deployment-id-hex>.access`
        and `app.<deployment-id-hex>.<permission>` with the requested role bindings; and records an event.
        Installing the Assistant application also creates its default agent and skills.


        Deployment is asynchronous: the response is 201 with `status` `installing` and `desired_status`
        `deployed`. The application controller then starts the runtime; poll `GET /tenant/applications/deployments/{deployment_id}`
        until `status` is `deployed` (or `degraded`/`failed`, with `last_error`).'
      operationId: create_deployment_tenant_applications_deployments_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantApplicationDeploymentRequest'
        required: true
