  /controlplane/application-archive-imports/{import_id}/retry:
    post:
      tags:
      - Control Plane Application Archive Imports
      summary: Retry a failed application archive import
      description: 'Run a `failed` import again from its retained staged archive; images already copied
        are reused. The import moves to `queued` with a new workflow run; poll `GET /controlplane/application-archive-imports/{import_id}`.


        Requires a control-plane access token or API key with the `controlplane.applications.manage` permission
        (roles `controlplane_admin` and `controlplane_app_publisher`; control-plane API keys always have
        it).


        Only imports whose upload was completed can be retried. Calling it while the import is `queued`
        or `importing` only makes sure the current workflow is running. If the workflow cannot be started
        the error is recorded in `error_message` and 502 is returned.'
      operationId: retry_import_controlplane_application_archive_imports__import_id__retry_post
      parameters:
      - name: import_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Id of the archive import.
          examples:
          - 5f0c8a52-7d3e-4b1a-9c2e-0000000000b0
          title: Import Id
        description: Id of the archive import.
      responses:
        '200':
          description: The import, `queued` (or still `queued`/`importing`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WSResponse_ApplicationArchiveImportResponse_'
              examples:
                queued:
                  summary: Retry queued
                  value:
                    success: true
