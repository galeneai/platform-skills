      - Control Plane Applications
      summary: Install an application for a tenant
      description: 'Install a package version for the tenant, as the tenant itself would with `POST /tenant/applications/deployments`.
        The version must be `active` in an `active` package and available to the tenant. Uninstalled deployments
        of the same package are reinstalled in place.


        Requires a control-plane access token or API key with the `controlplane.applications.deploy` permission
        (roles `controlplane_admin` and `controlplane_app_publisher`; control-plane API keys always have
        it).


        The request is validated against the manifest; Core then stores the environment (secrets in the
        secret store), provisions approved capabilities and declared databases, creates the application''s
        tenant permissions (`access` plus the manifest permissions) with the requested role bindings and
        records an event; `requested_by` is the caller. The application controller installs the runtime
        asynchronously: poll `GET /controlplane/application-deployments/{deployment_id}` until the status
        is `deployed`, `degraded` or `failed`. Bind hostnames with `POST /controlplane/application-deployments/{deployment_id}/domains`.'
