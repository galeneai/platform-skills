        size limit. Repeating the call after success with the same `archive_size_bytes` (and the same
        or no `archive_sha256`) returns the import unchanged (`Archive import completion already recorded`)
        and makes sure its workflow is running. If the workflow cannot be started the error is recorded
        in `error_message` and 502 is returned; repeat the call or use `retry`.'
