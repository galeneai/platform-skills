        component_name:
          type: string
          title: Component Name
          description: First `archive_import` component of the manifest.
        archive_filename:
          anyOf:
          - type: string
          - type: 'null'
          title: Archive Filename
          description: Original archive file name.
        staging_key:
          type: string
          title: Staging Key
          description: Key of the archive in the encrypted staging store.
        multipart_upload_id:
          anyOf:
