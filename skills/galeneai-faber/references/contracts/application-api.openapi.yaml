      summary: Create an application package version
      description: 'Publish a new version of the package from a manifest whose images are already in a
        registry (literal `image` or `image_source`). Versions are immutable: neither the manifest nor
        the status can be changed later. To publish images from an image archive, use `POST /controlplane/applications/{package_id}/archive-imports`
        instead.


        Requires a control-plane access token or API key with the `controlplane.applications.manage` permission
        (roles `controlplane_admin` and `controlplane_app_publisher`; control-plane API keys always have
        it).


        The manifest is stored normalized, with its `sha256:` digest; `created_by` records the caller.
        A new version is not installable until it is `active` and made available with `POST /controlplane/applications/{package_id}/availability`.
        Use `POST /controlplane/application-manifests/validate` to check a manifest first.


        Every registry source referenced by `image_source` must exist, and images of the internal registry
        must be pinned by `sha256:` digest.'
      operationId: create_application_package_version_controlplane_applications__package_id__versions_post
      parameters:
      - name: package_id
        in: path
        required: true
        schema:
