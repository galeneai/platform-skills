      description: One-time, short-lived server challenge for a verified tenant user.
      examples:
      - challenge_token: EXAMPLE-challenge-token-not-a-real-value-000000000000000000000000
        expires_in: 300
    TenantTemporaryPasswordCompleteRequest:
      properties:
        challenge_token:
          type: string
          minLength: 32
          title: Challenge Token
          description: '`challenge_token` returned by the temporary-password challenge.'
        new_password:
          type: string
          minLength: 1
          format: password
          title: New Password
          description: New permanent password. It must satisfy the Keycloak realm password policy.
          writeOnly: true
        totp:
          anyOf:
          - type: string
            maxLength: 12
            minLength: 4
          - type: 'null'
          title: Totp
          description: Current one-time code for the sign-in that follows the password change, when the
            account requires one.
      additionalProperties: false
      type: object
      required:
      - challenge_token
      - new_password
      title: TenantTemporaryPasswordCompleteRequest
      description: Replace a temporary password after a verified challenge.
      examples:
      - challenge_token: EXAMPLE-challenge-token-not-a-real-value-000000000000000000000000
        new_password: EXAMPLE-new-password-1
        totp: null
    TenantWorkerCapacity:
      properties:
        replicas:
          type: integer
          maximum: 64.0
          minimum: 1.0
          title: Replicas
          description: Number of worker replicas (1-64).
        resources:
          $ref: '#/components/schemas/TenantCapacityResourceProfile'
          description: CPU and memory of each replica.
      additionalProperties: false
      type: object
      required:
      - replicas
      - resources
      title: TenantWorkerCapacity
    UpdateTenantApplicationDeploymentRequest:
      properties:
        version_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Version Id
          description: Move the deployment to another version of the same package. The version must be
            active and available to the tenant.
        desired_status:
          anyOf:
          - $ref: '#/components/schemas/ApplicationDesiredStatus'
          - type: 'null'
          description: '`deployed` deploys or resumes the application, `suspended` stops its runtime and
            `uninstalled` removes it.'
        config:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Config
          description: Replacement application configuration, with the same restrictions as on install.
            Omit to keep the current configuration.
        env:
          anyOf:
          - items:
              $ref: '#/components/schemas/ApplicationEnvValue'
            type: array
          - type: 'null'
          title: Env
          description: Environment values to change, at most one entry per `component` and `name`. Variables
            that are not listed keep their current value.
        model_bindings:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/ApplicationModelBinding'
            type: object
          - type: 'null'
          title: Model Bindings
          description: Model selection per model role. Omit to keep the current selections, send `{}`
            to reset every role to the tenant default; `null` is rejected.
        approved_services:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Approved Services
          description: Replacement service approvals; omit to preserve, [] to revoke.
        service_bindings:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/ApplicationServiceBinding'
            type: object
          - type: 'null'
          title: Service Bindings
          description: Replacement resource bindings; omit to preserve, {} to clear. Null is rejected.
        approved_capabilities:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Approved Capabilities
          description: Replacement list of approved capabilities (unique names). Omit to keep the current
            list.
        permission_role_bindings:
          anyOf:
          - additionalProperties:
              items:
                type: string
                format: uuid
              type: array
            type: object
          - type: 'null'
          title: Permission Role Bindings
          description: Tenant role ids per application permission (`access` or a manifest permission name).
            Listed keys replace their bindings; omitted keys keep the current ones.
      type: object
      title: UpdateTenantApplicationDeploymentRequest
      description: 'Partial update of a deployment: omitted fields keep their current value.'
      examples:
      - env:
        - component: web
          name: SUPPORT_EMAIL
          value: helpdesk@example.com
        version_id: 5f0c8a52-7d3e-4b1a-9c2e-000000000012
      - desired_status: suspended
