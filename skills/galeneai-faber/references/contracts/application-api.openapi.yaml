    CreateApplicationArchiveImportRequest:
      properties:
        tenant_id:
          type: string
          format: uuid
          title: Tenant Id
          description: Tenant the images are published for. They are copied to the tenant's repositories
            `tenant/<tenant_id>/applications/<package-slug>/<version>/<component>` of the internal registry,
            and the published version is made available to this tenant.
          examples:
          - 5f0c8a52-7d3e-4b1a-9c2e-000000000001
        version:
          type: string
          maxLength: 128
          minLength: 1
          title: Version
          description: Version label to publish (1-128 characters). The package must not have this version
            yet.
          examples:
          - 1.5.0
        manifest:
          $ref: '#/components/schemas/ApplicationManifest'
          description: Manifest of the new version, with `app.slug` equal to the package slug. Between
            1 and 64 components declare `archive_import` instead of `image`, all with the same enabled
            and verified internal registry source; they receive images from the archive. Other components
            may reuse images of that registry only through `image_source` with a `sha256:` digest `reference`
            and no `repository`.
        archive_filename:
          type: string
          maxLength: 255
          minLength: 1
          title: Archive Filename
          description: Original file name of the archive, for display (1-255 characters, no directory
            part).
          examples:
          - helpdesk-1.5.0.tar
        release_notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Release Notes
          description: Optional release notes of the published version.
          examples:
          - Adds ticket templates.
      type: object
      required:
      - tenant_id
      - version
      - manifest
      - archive_filename
      title: CreateApplicationArchiveImportRequest
      description: Start publishing a package version whose images come from an uploaded archive.
      examples:
      - archive_filename: helpdesk-1.5.0.tar
        manifest:
          app:
            name: Helpdesk
            requires_core: '>=1.2.0'
            slug: helpdesk
          components:
          - archive_import:
              registry_source_id: 5f0c8a52-7d3e-4b1a-9c2e-0000000000a0
            env_schema:
            - name: SUPPORT_EMAIL
              required: true
            kind: frontend
            name: web
            port: 3000
          routes:
          - component: web
            role: frontend
          schema_version: '1.0'
        release_notes: Adds ticket templates.
        tenant_id: 5f0c8a52-7d3e-4b1a-9c2e-000000000001
        version: 1.5.0
    CreateApplicationPackageRequest:
      properties:
        slug:
          type: string
          title: Slug
          description: 'Permanent identifier of the package: 3-64 lowercase letters, digits or hyphens,
            starting and ending with a letter or digit (surrounding whitespace is removed and letters
            are lowercased). It must be unique and cannot be changed later; every version manifest of
            the package must declare the same `app.slug`.'
          examples:
          - helpdesk
        name:
          type: string
          title: Name
          description: Display name of the application. Must not be blank.
          examples:
          - Helpdesk
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Optional description shown in the application catalog.
          examples:
          - Ticket desk for customer support teams.
        status:
          $ref: '#/components/schemas/ApplicationPackageStatus'
          description: 'Catalog status: `draft` (default), `active`, `suspended` or `retired`. Tenants
            can install a version only while the package is `active`.'
          default: draft
        built_in:
          type: boolean
          title: Built In
          description: Marks a package that ships with the platform. Informational only.
          default: false
        owner:
          anyOf:
          - type: string
          - type: 'null'
          title: Owner
          description: Optional free-text owner or vendor of the application.
          examples:
          - Example Apps Ltd
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
          description: Free-form JSON object stored with the package and returned as is.
          examples:
          - category: support
      type: object
      required:
      - slug
      - name
      title: CreateApplicationPackageRequest
      description: New entry of the control-plane application catalog.
      examples:
      - description: Ticket desk for customer support teams.
        metadata:
          category: support
        name: Helpdesk
        owner: Example Apps Ltd
        slug: helpdesk
        status: draft
    CreateApplicationPackageVersionRequest:
      properties:
        version:
          type: string
          title: Version
          description: Version label, unique within the package, for example `1.4.0`. Surrounding whitespace
            is removed; it must not be blank.
          examples:
          - 1.4.0
        manifest:
          $ref: '#/components/schemas/ApplicationManifest'
          description: Application manifest; `app.slug` must equal the package slug. Components cannot
            use `archive_import` (publish those with an archive import), `connectivity.outbound_hosts`
            and the retired capability names `oidc_client`, `temporal`, `redis` and `direct_tenant_db`
            are rejected, and images of the internal registry must be referenced by `sha256:` digest.
        status:
          $ref: '#/components/schemas/ApplicationVersionStatus'
          description: '`draft` (default), `active`, `deprecated` or `retired`. Tenants can install only
            `active` versions made available to them, and no operation changes the status later: create
            installable versions as `active`.'
          default: draft
        release_notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Release Notes
          description: Optional release notes.
          examples:
          - Adds the ticket assignment permission.
      type: object
      required:
      - version
      - manifest
      title: CreateApplicationPackageVersionRequest
      description: A new immutable version of an application package.
      examples:
      - manifest:
          app:
            name: Helpdesk
            requires_core: '>=1.2.0'
            slug: helpdesk
          capabilities:
          - name: core_api
            required: true
          components:
          - env_schema:
            - description: Sender of ticket notifications.
              name: SUPPORT_EMAIL
              required: true
            - name: SMTP_PASSWORD
              sensitive: true
            - name: HELPDESK_MODEL_ID
            health:
              readiness_path: /healthz
            image: registry.example.com/acme/helpdesk-web:1.4.0
            kind: frontend
            name: web
            port: 3000
            resources:
              cpu: 500m
              memory: 512Mi
          database_resources:
          - env_prefix: HELPDESK_DB
            name: main
            target_components:
            - web
            url_env: HELPDESK_DATABASE_URL
          metadata:
            accent_color: '#1f6feb'
          model_requirements:
          - env:
            - component: web
              name: HELPDESK_MODEL_ID
            role: assistant
            slot: llm
          permissions:
          - description: Assign tickets to agents
            name: tickets.assign
          routes:
          - component: web
            role: frontend
          schema_version: '1.0'
        release_notes: Adds the ticket assignment permission.
        status: active
        version: 1.4.0
    CreateTenantApplicationDeploymentRequest:
      properties:
        package_id:
          type: string
          format: uuid
          title: Package Id
          description: Id of the application package to install.
        version_id:
          type: string
          format: uuid
          title: Version Id
          description: Version of that package to install. It must be active and available to the tenant.
        deployment_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Deployment Name
          description: Name of the deployment. Defaults to `<tenant-slug>-<package-slug>`; on a reinstall
            the previous name is kept when omitted.
          examples:
          - acme-helpdesk
        runtime:
          type: string
          title: Runtime
          description: Runtime selector passed to the application controller; `auto` lets the controller
            choose.
          default: auto
        config:
          additionalProperties: true
          type: object
          title: Config
          description: 'Free-form application configuration stored with the deployment. Environment variables
            go in `env`, model selections in `model_bindings`: the server-owned keys `model_bindings`,
            `model_binding_errors` and `model_status` are rejected, and so is `env.<component>.GALENE_APPLICATION_MODEL_CONTEXT`.'
        env:
          items:
            $ref: '#/components/schemas/ApplicationEnvValue'
          type: array
          title: Env
          description: Values for the environment variables declared by the manifest components, at most
            one entry per `component` and `name`. Required variables without a default must be supplied;
            variables declared `sensitive` need `secret_value` and the others `value`. Variables that
            Core generates for approved capabilities or model roles cannot be set.
        model_bindings:
          anyOf:
          - additionalProperties:
              $ref: '#/components/schemas/ApplicationModelBinding'
            type: object
          - type: 'null'
          title: Model Bindings
          description: Model selection for the manifest's model roles, keyed by role name. Roles left
            out use the tenant default model; an explicit model that is not usable by the tenant is rejected.
        approved_services:
          items:
            type: string
          type: array
          title: Approved Services
          description: Explicitly approved manifest service role names.
        service_bindings:
          additionalProperties:
            $ref: '#/components/schemas/ApplicationServiceBinding'
          type: object
          title: Service Bindings
          description: Tenant resource selections keyed by manifest resource role.
        approved_capabilities:
          items:
            type: string
          type: array
          title: Approved Capabilities
          description: 'Manifest capabilities the tenant approves, without duplicates: `core_api`, `identity_provider`,
            `object_storage`, `queue` or `memory_db`. Every capability the manifest marks `required` must
            be listed; Core provisions the approved ones and injects their credentials into the application
            environment.'
        permission_role_bindings:
          anyOf:
          - additionalProperties:
              items:
                type: string
                format: uuid
              type: array
            type: object
          - type: 'null'
          title: Permission Role Bindings
          description: 'Tenant role ids per application permission, keyed by `access` or by a permission
            name declared in the manifest. `access` decides who sees and launches the application (no
            roles: every tenant user); an action permission is held only by the listed roles. Omitted
            keys start with no roles.'
      type: object
      required:
      - package_id
      - version_id
      title: CreateTenantApplicationDeploymentRequest
      description: Install an application package version for the tenant.
      examples:
      - approved_capabilities:
        - core_api
        env:
        - component: web
          name: SUPPORT_EMAIL
          value: support@example.com
        - component: web
          name: SMTP_PASSWORD
          secret_value: EXAMPLE-not-a-real-password
        model_bindings:
          assistant:
            model_id: openai:gpt-4o-mini
            source: explicit
        package_id: 5f0c8a52-7d3e-4b1a-9c2e-000000000010
        permission_role_bindings:
          access:
          - 5f0c8a52-7d3e-4b1a-9c2e-000000000040
          - 5f0c8a52-7d3e-4b1a-9c2e-000000000041
          tickets.assign:
          - 5f0c8a52-7d3e-4b1a-9c2e-000000000041
        version_id: 5f0c8a52-7d3e-4b1a-9c2e-000000000011
    CreateTenantApplicationDomainRequest:
      properties:
        component_name:
          type: string
          title: Component Name
          description: Name of the deployment component that receives the traffic. The component must
            exist in the deployment and declare a `port`.
          examples:
          - web
        host:
          anyOf:
          - type: string
          - type: 'null'
          title: Host
          description: Fully qualified hostname to route (lowercased, trailing dot removed). Send either
            `host` or `managed_domain_id`. Through the tenant API the host must already be reserved for
            the tenant in the managed-domain catalog; through the control-plane API an unknown host is
            added to the catalog and reserved for the deployment's tenant. Hosts reserved for platform
            infrastructure or held by another tenant, console or application are rejected.
          examples:
          - helpdesk.acme.example.com
        managed_domain_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Managed Domain Id
          description: Id of a managed-domain catalog entry whose host is used, as listed by the domain
            options operations. When `host` is also sent it must be the same hostname.
          examples:
          - 5f0c8a52-7d3e-4b1a-9c2e-000000000031
        route_role:
          type: string
          title: Route Role
          description: Role of the route, for example `frontend`, `api` or `webhook`. The application
            launcher opens the first active `frontend` domain. Must not be blank. Defaults to `frontend`.
          default: frontend
          examples:
          - frontend
        certificate_mode:
          anyOf:
          - $ref: '#/components/schemas/ManagedDomainCertificateMode'
          - type: 'null'
          description: 'How TLS is served for the host: `appliance` (the mounted appliance certificate,
            which must cover the host), `automatic` (certificate issued automatically), `uploaded` (a
            certificate of the certificate catalog, see `certificate_id`) or `disabled`. Omit to keep
            the host''s current mode; a host new to the catalog starts in `appliance` mode when the appliance
            certificate covers it, else `automatic`. With a raw `host` in `uploaded` mode, `certificate_id`
            (or the legacy PEM pair) is required.'
        certificate_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Certificate Id
          description: Id of a certificate of the control-plane certificate catalog to serve for the host.
            Only accepted in `uploaded` mode (sent, or already set on the host). The certificate must
            cover the host and be valid now.
          examples:
          - 5f0c8a52-7d3e-4b1a-9c2e-000000000032
        tls_certificate_pem:
          anyOf:
          - type: string
            format: password
            writeOnly: true
          - type: 'null'
          title: Tls Certificate Pem
          description: Deprecated, use `certificate_id`. PEM certificate chain, sent together with `tls_private_key_pem`
            and never with `certificate_id`. The pair must match a certificate that already exists in
            the certificate catalog; it is resolved to that certificate and not stored with the domain.
        tls_private_key_pem:
          anyOf:
          - type: string
            format: password
            writeOnly: true
          - type: 'null'
          title: Tls Private Key Pem
          description: Deprecated, use `certificate_id`. PEM private key matching `tls_certificate_pem`;
            never stored with the domain or returned.
      additionalProperties: false
      type: object
      required:
      - component_name
      title: CreateTenantApplicationDomainRequest
      description: Route a hostname to one component of an application deployment.
      examples:
      - component_name: web
        managed_domain_id: 5f0c8a52-7d3e-4b1a-9c2e-000000000031
      - certificate_id: 5f0c8a52-7d3e-4b1a-9c2e-000000000032
        certificate_mode: uploaded
        component_name: web
        host: helpdesk.acme.example.com
        route_role: frontend
    CreateTenantRequest:
      properties:
        slug:
          type: string
          maxLength: 48
          minLength: 3
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          title: Slug
          description: 'Unique, permanent tenant identifier: lowercase letters and digits, optionally
            separated by single hyphens. It also names the tenant''s Keycloak realm and databases (`galene_tenant_<slug>`,
            `galene_observability_<slug>`, with hyphens turned into underscores). The schema accepts 3-48
            characters, but the observability database name limits the slug to 42 characters: a longer
            slug is rejected with 422.'
          examples:
          - acme
        display_name:
          type: string
          maxLength: 200
          minLength: 1
          title: Display Name
          description: Human-readable tenant name, 1-200 characters.
          examples:
          - Acme Corporation
        admin_first_name:
          type: string
          maxLength: 100
          minLength: 1
          title: Admin First Name
          description: Given name of the first tenant administrator, 1-100 characters.
          examples:
          - Jane
        admin_last_name:
          type: string
          maxLength: 100
          minLength: 1
          title: Admin Last Name
          description: Family name of the first tenant administrator, 1-100 characters.
          examples:
          - Doe
        admin_email:
          type: string
          maxLength: 320
          minLength: 3
          title: Admin Email
          description: Email address of the first tenant administrator, also its Keycloak username. Trimmed
            and lowercased; must contain exactly one `@` that is neither the first nor the last character.
          examples:
          - jane.doe@example.com
        admin_password:
          type: string
          minLength: 12
          format: password
          title: Admin Password
          description: Initial password of the first tenant administrator, at least 12 characters. It
            is temporary (a new password is required at the first sign-in) and is neither stored by the
            backend nor returned.
          writeOnly: true
        initial_credential_custody_confirmed:
          type: boolean
          title: Initial Credential Custody Confirmed
          description: Confirms that the caller keeps `admin_password` and hands it to the tenant administrator.
            Must be `true` when the platform delivers initial credentials manually (the default delivery
            mode); not needed when the platform emails the administrator a password-setup link.
          default: false
          examples:
          - true
        embedding_config:
          $ref: '#/components/schemas/EmbeddingConfigurationRequest'
          description: Embedding model of the tenant's `text` vector space (and optionally of the `multimodal`
            space), with its exact dimensions. The model must be an enabled `embedding` model of an enabled
            provider, support the space's modality and declare exactly these dimensions.
        console_domain:
          anyOf:
          - type: string
            maxLength: 253
            minLength: 4
          - type: 'null'
          title: Console Domain
          description: 'Host name of the tenant Console. Optional: when set it must equal the host of
            `managed_domain_id`; when omitted that host is used.'
          examples:
          - console-acme.example.com
        managed_domain_id:
          type: string
          format: uuid
          title: Managed Domain Id
          description: Identifier of an available (unassigned) managed-domain catalog entry; its host
            becomes the tenant Console host.
          examples:
          - 5f0c8a52-7d3e-4b1a-9c2e-000000000a02
        capacity:
          anyOf:
          - $ref: '#/components/schemas/TenantCapacitySpec'
          - type: 'null'
          description: Worker replicas and resources, queue limits and AI call limits of the tenant. Omit
            it to use the current global tenant capacity template.
      additionalProperties: false
      type: object
      required:
      - slug
      - display_name
      - admin_first_name
      - admin_last_name
      - admin_email
      - admin_password
      - embedding_config
      - managed_domain_id
      title: CreateTenantRequest
      description: A new tenant with its first administrator.
      examples:
      - admin_email: jane.doe@example.com
        admin_first_name: Jane
        admin_last_name: Doe
        admin_password: EXAMPLE-Passw0rd-2026
        console_domain: console-acme.example.com
        display_name: Acme Corporation
        embedding_config:
          text:
            dimensions: 1536
            model_id: 5f0c8a52-7d3e-4b1a-9c2e-000000000090
        initial_credential_custody_confirmed: true
        managed_domain_id: 5f0c8a52-7d3e-4b1a-9c2e-000000000a02
        slug: acme
    EmbeddingConfigurationRequest:
      properties:
        text:
          $ref: '#/components/schemas/EmbeddingSpaceRequest'
          description: Model and dimensions of the text vector space (requires a text-capable model).
        multimodal:
          anyOf:
          - $ref: '#/components/schemas/EmbeddingSpaceRequest'
          - type: 'null'
          description: Model and dimensions of the image vector space (requires an image-capable model).
            Omit when the tenant has no image embeddings.
      additionalProperties: false
      type: object
      required:
      - text
      title: EmbeddingConfigurationRequest
      examples:
      - text:
          dimensions: 1024
          model_id: 5f0c8a52-7d3e-4b1a-9c2e-000000000211
    EmbeddingSpaceRequest:
      properties:
        model_id:
          type: string
          format: uuid
          title: Model Id
          description: 'Registry id of the embedding model: an enabled model of slot `embedding` on an
            enabled provider, not revoked for the tenant.'
        dimensions:
          type: integer
          maximum: 4000.0
          minimum: 1.0
          title: Dimensions
          description: Vector size (integer from 1 to 4000). Must equal the model's `embedding_dimensions`.
          examples:
          - 1024
      additionalProperties: false
      type: object
      required:
      - model_id
      - dimensions
      title: EmbeddingSpaceRequest
      examples:
      - dimensions: 1024
        model_id: 5f0c8a52-7d3e-4b1a-9c2e-000000000211
    HTTPErrorResponse:
      properties:
        detail:
          type: string
          title: Detail
          description: Human-readable error message.
      additionalProperties: false
      type: object
      required:
      - detail
      title: HTTPErrorResponse
      description: 'Error with a human-readable message in `detail`.


        Produced by authentication and authorization dependencies and by handlers

        that raise FastAPI `HTTPException` with a text detail.'
      examples:
      - detail: Resource not found.
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LegacyExceptionErrorResponse:
      properties:
        message:
          type: string
          title: Message
          description: Generic error message.
        error:
          type: string
          title: Error
          description: Text of the internal exception, for diagnostics only.
      additionalProperties: false
      type: object
      required:
      - message
      - error
      title: LegacyExceptionErrorResponse
      description: 'Unexpected-failure error returned by older controllers.


        `error` contains the text of the internal exception and is meant for

        diagnostics only; do not parse it.'
      examples:
      - error: connection to the database was lost
        message: An error occurred
    ManagedDomainCertificateMode:
      type: string
      enum:
      - appliance
      - automatic
      - uploaded
      - disabled
      title: ManagedDomainCertificateMode
      description: How Caddy obtains TLS material for a managed hostname.
    MessageErrorResponse:
      properties:
        message:
          type: string
          title: Message
          description: Human-readable error message.
      additionalProperties: true
      type: object
      required:
      - message
      title: MessageErrorResponse
      description: 'Error with a human-readable `message`.


        Returned by many resource controllers. Some errors add context fields next

        to `message` (for example `holder` for a held lock or `current_revision`

        for a revision conflict); each operation documents the fields it adds.'
      examples:
      - message: User not found
    PublicKeycloakConfig:
      properties:
        url:
          type: string
          title: Url
          description: Public base URL of the Keycloak server.
        realm:
          type: string
          title: Realm
          description: Keycloak realm that authenticates the users.
        client_id:
          type: string
          title: Client Id
          description: Public OIDC client id to use with this realm.
        issuer:
          type: string
          title: Issuer
          description: Token issuer URL, `<url>/realms/<realm>`.
      type: object
      required:
      - url
      - realm
      - client_id
      - issuer
      title: PublicKeycloakConfig
      description: Public Keycloak settings a frontend needs to start a sign-in.
      examples:
      - client_id: galene-controlplane
        issuer: https://auth-acme.example.com/realms/master
        realm: master
        url: https://auth-acme.example.com
    PublicMFAConfig:
      properties:
        required:
          type: boolean
          title: Required
          description: Whether sign-in requires a one-time code from an authenticator app.
          default: false
        supported_methods:
          items:
            type: string
          type: array
          title: Supported Methods
          description: Supported second factors. Currently `totp` (time-based one-time codes).
      type: object
      title: PublicMFAConfig
      description: Multi-factor authentication policy that applies to the sign-in.
      examples:
      - required: true
        supported_methods:
        - totp
    RegistrySourceResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: Registry source id.
        slug:
          type: string
          title: Slug
          description: Permanent identifier of the source.
        name:
          type: string
          title: Name
          description: Display name.
        kind:
          type: string
          enum:
          - internal
          - external
          title: Kind
          description: '`internal` (the integrated registry) or `external` (a third-party registry).'
        endpoint:
          type: string
          title: Endpoint
          description: HTTPS origin of the registry API.
        verification_repository:
          anyOf:
          - type: string
          - type: 'null'
          title: Verification Repository
          description: Repository probed by verification (external sources).
        node_trust_ca_sha256:
          anyOf:
          - type: string
          - type: 'null'
          title: Node Trust Ca Sha256
          description: Attested SHA-256 of the CA bundle trusted by the cluster nodes.
        token_realm_allowlist:
          items:
            type: string
          type: array
          title: Token Realm Allowlist
          description: Extra origins accepted as Bearer token realm.
        enabled:
          type: boolean
          title: Enabled
          description: Whether deployments may use the source.
        credential_configured:
          type: boolean
          title: Credential Configured
          description: Whether a registry credential is stored (internal sources always have a generated
            one).
          default: false
        ca_bundle_configured:
          type: boolean
          title: Ca Bundle Configured
          description: Whether a CA bundle is stored.
          default: false
        verification_status:
          type: string
          enum:
          - unverified
          - verified
          - failed
          title: Verification Status
          description: 'Result of the last `POST .../verify`: `unverified` for new sources and after connection
            changes, `verified` or `failed`. Deployments and archive imports need a `verified` source.'
        verification_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Verification Message
          description: Why the last verification failed.
        verified_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Verified At
          description: Time of the last successful verification; null unless the source is `verified`.
        credentials_ready:
          type: boolean
          title: Credentials Ready
          description: Always true for external sources. For the internal source, true once the application
            controller has applied and acknowledged the current registry credential revision.
          default: false
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Creation time.
        updated_at:
          type: string
          format: date-time
          title: Updated At
          description: Last update time.
      type: object
      required:
      - id
      - slug
      - name
      - kind
      - endpoint
      - verification_repository
      - node_trust_ca_sha256
      - token_realm_allowlist
      - enabled
      - verification_status
      - verification_message
      - verified_at
      - created_at
      - updated_at
      title: RegistrySourceResponse
      description: A configured container registry source. Credentials are never returned.
      examples:
      - ca_bundle_configured: false
        created_at: '2026-09-27T09:00:00Z'
        credential_configured: true
        credentials_ready: true
        enabled: true
        endpoint: https://registry.example.com
        id: 5f0c8a52-7d3e-4b1a-9c2e-0000000000a0
        kind: internal
        name: Integrated registry
        node_trust_ca_sha256: null
        slug: integrated
        token_realm_allowlist: []
        updated_at: '2026-09-27T09:12:00Z'
        verification_message: null
        verification_repository: null
        verification_status: verified
        verified_at: '2026-09-27T09:12:00Z'
    RegistrySourceWrite:
      properties:
        slug:
          type: string
          title: Slug
          description: 'Permanent, unique identifier: 3-64 lowercase letters, digits or hyphens, starting
            and ending with a letter or digit (trimmed and lowercased).'
          examples:
          - vendor-images
        name:
          type: string
          title: Name
          description: Display name of the source. Must not be blank.
          examples:
          - Vendor images
        kind:
          type: string
          enum:
          - internal
          - external
          title: Kind
          description: '`internal`: the registry integrated with the platform; at most one can exist,
            its credentials are generated by the platform and it stores tenant images and archive imports.
            `external`: a third-party registry the platform pulls images from with the credential given
            here.'
        endpoint:
          type: string
          title: Endpoint
          description: HTTPS origin of the registry API, without path, query or fragment (a trailing slash
            is removed), for example `https://registry.example.com`.
          examples:
          - https://images.example.org
        verification_repository:
          anyOf:
          - type: string
          - type: 'null'
          title: Verification Repository
          description: 'External sources that use Bearer token authentication: repository whose pull access
            is probed by `POST .../verify`, for example `example-apps/helpdesk-web`. Not accepted for
            `internal` sources.'
          examples:
          - example-apps/helpdesk-web
        node_trust_ca_sha256:
          anyOf:
          - type: string
          - type: 'null'
          title: Node Trust Ca Sha256
          description: 'External sources with a private CA: operator attestation that every cluster node
            already trusts the CA, given as the SHA-256 of the exact `ca_bundle_pem` text (64 hex digits,
            optional `sha256:` prefix). Deployments that use this source are refused until it matches
            the stored CA bundle. Not accepted for `internal` sources.'
          examples:
          - 3c9a1e0b7d2f4a6c3c9a1e0b7d2f4a6c3c9a1e0b7d2f4a6c3c9a1e0b7d2f4a6c
        token_realm_allowlist:
          items:
            type: string
          type: array
          title: Token Realm Allowlist
          description: Extra HTTPS origins (no path, unique) accepted as Bearer token realm besides the
            endpoint origin, for registries whose token service runs on another host.
          examples:
          - - https://auth.example.org
        enabled:
          type: boolean
          title: Enabled
          description: Whether deployments may use the source. Defaults to true.
          default: true
        username:
          anyOf:
          - type: string
          - type: 'null'
          title: Username
          description: User name of the registry credential, sent together with `password`. External sources
            require a credential; internal sources do not accept one (the platform generates it).
          examples:
          - robot-galene
        password:
          anyOf:
          - type: string
            format: password
            writeOnly: true
          - type: 'null'
          title: Password
          description: Password or access token of the registry credential. Stored encrypted and never
            returned.
        ca_bundle_pem:
          anyOf:
          - type: string
            format: password
            writeOnly: true
          - type: 'null'
          title: Ca Bundle Pem
          description: PEM CA bundle the platform trusts when it connects to the registry. Stored encrypted
            and never returned; see `node_trust_ca_sha256` for the cluster nodes.
      type: object
      required:
      - slug
      - name
      - kind
      - endpoint
      title: RegistrySourceWrite
      description: A new internal or external container registry source.
      examples:
      - endpoint: https://registry.example.com
        kind: internal
        name: Integrated registry
        slug: integrated
      - endpoint: https://images.example.org
        kind: external
        name: Vendor images
        password: EXAMPLE-not-a-real-password
        slug: vendor-images
        token_realm_allowlist:
        - https://auth.example.org
        username: robot-galene
        verification_repository: example-apps/helpdesk-web
    SSOConnectorPublicResponse:
