      description: 'Documentation-only: body of sign-out and first-login OTP enrollment calls.'
      examples:
      - success: true
    AuthTokenResponse:
      properties:
        access_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Access Token
          description: 'Access token (JWT). Send it as `Authorization: Bearer <access_token>`. Omitted,
            with `refresh_token`, when the request sent `X-Galene-Session: cookie`: the tokens then stay
            on the server behind an opaque `HttpOnly` session cookie (`__Host-galene_sid`) and the body
            carries `csrf_token`, to send as `X-Galene-CSRF` on state-changing calls authenticated by
            the cookie.'
        refresh_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Refresh Token
          description: Refresh token for the matching refresh endpoint. After a tenant SSO sign-in it
            is an opaque `sso.`-prefixed handle that stays the same across refreshes.
        expires_in:
          anyOf:
          - type: integer
          - type: 'null'
          title: Expires In
          description: Access token lifetime in seconds.
        refresh_expires_in:
          anyOf:
          - type: integer
          - type: 'null'
          title: Refresh Expires In
          description: Refresh token lifetime in seconds.
        token_type:
          type: string
          title: Token Type
          description: Token type, `Bearer`.
          default: Bearer
        scope:
          anyOf:
          - type: string
          - type: 'null'
          title: Scope
          description: Granted OAuth scopes.
        user:
          $ref: '#/components/schemas/AuthUserInfo'
          description: The signed-in user.
      type: object
      required:
      - user
      title: AuthTokenResponse
      description: Tokens of a new or refreshed session, with the signed-in user.
      examples:
      - access_token: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.EXAMPLE.SIGNATURE
        expires_in: 300
        refresh_expires_in: 1800
        refresh_token: eyJhbGciOiJIUzUxMiIsInR5cCI6IkpXVCJ9.EXAMPLE-REFRESH.SIGNATURE
        scope: openid profile email
        token_type: Bearer
        user:
          avatar_mime_type: null
          avatar_size_bytes: null
          avatar_updated_at: null
          avatar_url: null
          controlplane: false
          email: john.smith@example.com
          first_name: John
          inference_language: en
          last_name: Smith
          organization_id: null
          permissions:
