      summary: Rotate application service credentials for your tenant
      description: 'Rotate Core-managed backend/worker service bootstrap credentials for one application
        deployment in the authenticated tenant.


        Requires tenant user authentication and `application.update`. The deployment must have desired_status
        deployed and an available immutable version.


        Core increments service_grant_revision, stores fresh managed secrets for approved target components,
        and requests redeployment. Previous short access tokens and persisted authority become invalid.
        The response exposes only deployment ID and new revision, never credentials. Each repeat rotates
        again; there is no idempotency key on this route. Poll the deployment''s management API for runtime
        readiness before relying on the new component bootstrap credentials.'
