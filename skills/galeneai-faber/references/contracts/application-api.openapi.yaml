  /controlplane/application-deployments/{deployment_id}/domains:
    post:
      tags:
      - Control Plane Applications
      summary: Bind a domain to an application deployment
      description: 'Route a hostname to a component of a deployment of any tenant. The host is taken from
        `host` or from the managed-domain entry `managed_domain_id`; unlike the tenant API it does not
        need to be reserved beforehand: an unknown host is added to the managed-domain catalog and reserved
        for the deployment''s tenant. TLS is configured on the host with `certificate_mode` and `certificate_id`.


        Requires a control-plane access token or API key with the `controlplane.applications.deploy` permission
        (roles `controlplane_admin` and `controlplane_app_publisher`; control-plane API keys always have
        it).


        The binding starts `pending_validation`; the deployment is queued for reconciliation (status `installing`,
        `updating` or `resuming`) and an event is recorded. Poll `GET /controlplane/application-deployments/{deployment_id}`
        until the domain is `active`.'
      operationId: create_application_domain_controlplane_application_deployments__deployment_id__domains_post
      parameters:
      - name: deployment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Id of the application deployment.
          examples:
          - 5f0c8a52-7d3e-4b1a-9c2e-000000000020
          title: Deployment Id
        description: Id of the application deployment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantApplicationDomainRequest'
      responses:
        '201':
          description: The new domain binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WSResponse_TenantApplicationDomainResponse_'
              example:
