                    detail: Keycloak did not return an ID token
                no_refresh:
                  summary: No renewable credentials
                  value:
                    detail: Keycloak did not return renewable SSO credentials
                resource:
                  summary: Resource authorization
                  value:
                    detail: Resource authorization could not be verified
              schema:
                $ref: '#/components/schemas/HTTPErrorResponse'
        '503':
          description: 'The tenant is in maintenance for an embedding migration (sent with `Retry-After:
