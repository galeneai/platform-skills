  /public/tenants/{tenant_slug}/auth/sso/callback:
    get:
      tags:
      - Authentication
      summary: Receive the tenant SSO redirect
      description: 'Redirect target of the tenant''s Keycloak realm at the end of an SSO sign-in started
        with `POST /public/tenants/{tenant_slug}/auth/sso/start` (and of the offline authorizations started
        for scheduled tasks). Browsers reach it through the redirect; clients do not call it directly
        and no credential is needed.


        Core exchanges `code` with Keycloak, verifies the ID token, the identity provider provenance and,
        for Google Workspace and Microsoft 365, the organization policy; creates or updates the tenant
        user and its SSO group memberships; stores the session credentials encrypted; and answers with
        a 303 redirect to the return URI with `sso_transaction=<transaction id>.<exchange code>` (`offline_sso_transaction=...`
        for offline authorizations). The sign-in is completed by `POST /public/tenants/{tenant_slug}/auth/sso/exchange`.


        Errors are returned as JSON to the browser. If Keycloak redirects without `code` the request fails
        validation with 422.'
      operationId: callback_public_tenants__tenant_slug__auth_sso_callback_get
      parameters:
      - name: tenant_slug
        in: path
        required: true
        schema:
          type: string
          description: Slug of the tenant.
          examples:
          - acme
          title: Tenant Slug
        description: Slug of the tenant.
      - name: state
        in: query
        required: true
        schema:
          type: string
          description: Opaque `state` value issued when the sign-in started.
          title: State
        description: Opaque `state` value issued when the sign-in started.
      - name: code
        in: query
        required: true
        schema:
          type: string
          description: Authorization code issued by Keycloak.
          title: Code
        description: Authorization code issued by Keycloak.
      responses:
        '200':
          description: 'Not returned: a successful call answers with the 303 redirect.'
          content:
            application/json:
              schema: {}
        '303':
          description: Sign-in verified; the browser is sent back to the Assistant.
          headers:
            Location:
              description: Return URI with the `sso_transaction` (or `offline_sso_transaction`) query
                parameter.
              schema:
                type: string
              example: https://assistant-acme.example.com/login?sso_transaction=5f0c8a52-7d3e-4b1a-9c2e-000000000701.EXAMPLE-exchange-code-not-real
        '400':
          description: '`state` does not match a pending transaction (unknown, already completed or older
            than 5 minutes), or the transaction is malformed.'
          content:
            application/json:
              examples:
                expired:
                  summary: Unknown or expired state
                  value:
                    detail: Invalid or expired SSO transaction
                invalid:
                  summary: Malformed transaction
                  value:
                    detail: Invalid SSO transaction
              schema:
                $ref: '#/components/schemas/HTTPErrorResponse'
        '401':
          description: Keycloak rejected the code, or the ID token, provider provenance or user identity
            could not be verified.
          content:
            application/json:
              examples:
                code_rejected:
                  summary: Code rejected
                  value:
                    detail: SSO code exchange failed
                id_token:
                  summary: Invalid ID token
                  value:
                    detail: Invalid SSO ID token
                provenance:
                  summary: Wrong identity provider
                  value:
                    detail: SSO provider provenance is invalid
                userinfo:
                  summary: Access token rejected
                  value:
                    detail: Invalid or expired token.
              schema:
                $ref: '#/components/schemas/HTTPErrorResponse'
        '403':
          description: The tenant is not active, the account's organization is not allowed by the connector,
            the tenant user is inactive, or an offline authorization is no longer permitted.
          content:
            application/json:
              examples:
                tenant_inactive:
                  summary: Tenant not active
                  value:
                    detail: Tenant is not active.
                organization:
                  summary: Organization not allowed
                  value:
                    detail: Organization account is not allowed
                user_inactive:
                  summary: User inactive
                  value:
                    detail: Tenant user is not active.
              schema:
                $ref: '#/components/schemas/HTTPErrorResponse'
        '404':
          description: No tenant has this slug.
          content:
            application/json:
              examples:
                tenant:
                  summary: Unknown tenant
                  value:
                    detail: Tenant not found.
              schema:
                $ref: '#/components/schemas/HTTPErrorResponse'
        '409':
          description: The connector was disabled or removed during the sign-in, or the SSO identity matches
            an existing user's email but is linked to another account.
          content:
            application/json:
              examples:
                connector:
                  summary: Connector unavailable
