  /controlplane/applications/{package_id}/archive-imports:
    post:
      tags:
      - Control Plane Application Archive Imports
      summary: Start an application archive import
      description: 'Start publishing a new version of the package whose images come from a Docker (`docker
        save`) or OCI image-layout archive, optionally compressed, of up to 20 GiB. The archive is uploaded
        in parts to an encrypted staging store, then a background workflow copies the images to the tenant''s
        repositories of the integrated registry and publishes the version.


        Requires a control-plane access token or API key with the `controlplane.applications.manage` permission
        (roles `controlplane_admin` and `controlplane_app_publisher`; control-plane API keys always have
        it).


        Steps:

        1. This call creates the import in status `uploading` and opens a multipart upload.

        2. For each part, `POST /controlplane/application-archive-imports/{import_id}/parts/{part_number}`
        returns a presigned URL; `PUT` the bytes there and keep the `ETag`. `GET .../parts` lists the
        parts already stored, to resume an interrupted upload.

        3. `POST .../complete` assembles the archive and queues the import.

        4. Poll `GET /controlplane/application-archive-imports/{import_id}`. The worker lists the archive''s
        images in `candidate_images`; when the manifest has one `archive_import` component and the archive
        one image it is used automatically, otherwise the import waits in `awaiting_selection` for `select-image`
        or `select-images`. On `ready` the version exists (`result_version_id`), is `active` and is available
        to `tenant_id`.


        Only one import can be active per package version, and the version must not exist yet.'
      operationId: create_import_controlplane_applications__package_id__archive_imports_post
      parameters:
      - name: package_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Id of the application package to publish a version for.
          examples:
          - 5f0c8a52-7d3e-4b1a-9c2e-000000000010
          title: Package Id
        description: Id of the application package to publish a version for.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationArchiveImportRequest'
