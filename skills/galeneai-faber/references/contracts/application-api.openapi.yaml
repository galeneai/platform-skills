    SSOExchangeRequest:
      properties:
        transaction_id:
          type: string
          maxLength: 512
          minLength: 20
          title: Transaction Id
          description: Value of the `sso_transaction` query parameter that the SSO callback added to `redirect_uri`
            (`<transaction id>.<exchange code>`).
        browser_binding:
          type: string
          maxLength: 512
          minLength: 32
          title: Browser Binding
          description: The `browser_binding` sent when the SSO sign-in started.
      additionalProperties: false
      type: object
      required:
      - transaction_id
      - browser_binding
      title: SSOExchangeRequest
      description: Exchange a completed SSO transaction for tokens.
      examples:
      - browser_binding: EXAMPLE-browser-binding-not-a-real-value-00000000
        transaction_id: 5f0c8a52-7d3e-4b1a-9c2e-000000000701.EXAMPLE-exchange-code-not-real
    SSOStartRequest:
      properties:
        alias:
          type: string
          maxLength: 120
          minLength: 1
          title: Alias
          description: Alias of an enabled SSO connector, as listed in `sso_connectors` of `GET /public/tenants/{tenant_slug}/auth/config`.
        redirect_uri:
          type: string
          maxLength: 2048
          minLength: 1
          title: Redirect Uri
          description: 'Page the browser returns to after sign-in: an `https` URL with path `/login`,
            no port, credentials, query or fragment, on a login host registered for the tenant.'
        browser_binding:
          type: string
          maxLength: 512
          minLength: 32
          title: Browser Binding
          description: Random secret generated and kept by the browser. Send the same value to the SSO
            exchange call; it binds the transaction to this browser.
      additionalProperties: false
      type: object
      required:
      - alias
      - redirect_uri
      - browser_binding
      title: SSOStartRequest
      description: Start a browser sign-in through a tenant SSO connector.
      examples:
      - alias: corporate-oidc
        browser_binding: EXAMPLE-browser-binding-not-a-real-value-00000000
        redirect_uri: https://assistant-acme.example.com/login
    SSOStartResponse:
      properties:
        authorization_url:
          type: string
          title: Authorization Url
          description: Keycloak authorization URL to open in the browser; it pre-selects the connector.
        transaction_id:
          type: string
          title: Transaction Id
          description: Identifier of the pending SSO transaction.
        expires_at:
          type: string
          format: date-time
          title: Expires At
          description: When the transaction expires (5 minutes after it starts).
      type: object
      required:
      - authorization_url
      - transaction_id
      - expires_at
      title: SSOStartResponse
      description: Pending SSO transaction and the URL that starts it.
      examples:
      - authorization_url: https://auth-acme.example.com/realms/acme/protocol/openid-connect/auth?client_id=galene-sso-auth-facade&response_type=code&scope=openid+profile+email&redirect_uri=https%3A%2F%2Fapi-acme.example.com%2Fpublic%2Ftenants%2Facme%2Fauth%2Fsso%2Fcallback&state=EXAMPLE-state&nonce=EXAMPLE-nonce&code_challenge=EXAMPLE-code-challenge&code_challenge_method=S256&kc_idp_hint=corporate-oidc
        expires_at: '2026-09-27T09:35:00Z'
        transaction_id: 5f0c8a52-7d3e-4b1a-9c2e-000000000701
    SelectApplicationArchiveCandidateRequest:
