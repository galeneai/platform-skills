      - registry_model_id
      - public_model_id
      - provider
      - model
      - dimensions
      - generation
      - fingerprint
      - semantic_validated
      title: ApplicationActiveEmbeddingSpace
      description: The tenant's active embedding space, as seen by an embedding model role.
      examples:
      - dimensions: 1536
        fingerprint: sha256:fedcba9876543210fedcba9876543210fedcba9876543210fedcba9876543210
        generation: 5f0c8a52-7d3e-4b1a-9c2e-000000000101
        model: text-embedding-3-small
        provider: openai
