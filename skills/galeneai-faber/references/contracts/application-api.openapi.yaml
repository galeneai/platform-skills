    patch:
      tags:
      - Control Plane Applications
      summary: Update a tenant application deployment
      description: 'Change a deployment of any tenant, as the tenant itself would with `PATCH /tenant/applications/deployments/{deployment_id}`:
        move to another version of the package, change configuration, environment values, model selections,
        approved capabilities or permission role bindings, or set `desired_status` to `deployed`, `suspended`
        or `uninstalled`. Fields that are not sent are kept.


        Requires a control-plane access token or API key with the `controlplane.applications.deploy` permission
        (roles `controlplane_admin` and `controlplane_app_publisher`; control-plane API keys always have
        it).


        Changes are validated against the manifest of the (new) version, which must be `active` and available
        to the tenant. Changing the version, `config`, `env`, `model_bindings` or `approved_capabilities`
        provisions secrets and capability credentials again; databases are ensured unless the deployment
        is being uninstalled, and the tenant''s application permissions are synchronized. Those changes
        and `desired_status` queue the deployment for the application controller, which works asynchronously:
        poll `GET /controlplane/application-deployments/{deployment_id}`.'
