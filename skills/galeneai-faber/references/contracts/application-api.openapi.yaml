      description: 'First step of replacing a temporary password: Keycloak verifies the username and temporary
        password in the tenant''s realm (and `totp` when the account already has an authenticator), and
        the call returns a short-lived, single-use `challenge_token` for `POST /public/tenants/{tenant_slug}/auth/temporary-password/complete`.
        No authentication is required and no password is changed yet.


        Attempts are rate limited per tenant username and per client address (the connection address,
        or the `X-Forwarded-For` client when the peer is a trusted proxy): by default 5 attempts, successful
        ones included, per 15 minutes. The challenge token expires after 5 minutes by default.'
      operationId: start_tenant_temporary_password_update_public_tenants__tenant_slug__auth_temporary_password_challenge_post
      parameters:
      - name: tenant_slug
        in: path
        required: true
        schema:
          type: string
          description: Slug of the tenant, as used in its URLs.
          examples:
          - acme
          title: Tenant Slug
        description: Slug of the tenant, as used in its URLs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantTemporaryPasswordChallengeRequest'
      responses:
        '200':
          description: Challenge token for the completion step.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantTemporaryPasswordChallengeResponse'
              example:
                challenge_token: EXAMPLE-challenge-token-not-a-real-value-000000000000000000000000
                expires_in: 300
        '401':
          description: Keycloak could not verify the username and temporary password, or the account requires
            a one-time code (`totp_required` challenge).
          content:
            application/json:
              examples:
                not_verified:
                  summary: Credentials not verified
                  value:
                    detail: Unable to verify temporary credentials.
                totp_required:
                  summary: One-time code required
                  value:
                    detail:
                      challenge: totp_required
                      message: Enter your one-time code to change your password.
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '409':
          description: The account cannot complete a temporary-password sign-in (no pending password update),
            or Keycloak's temporary-password verification failed or answered unexpectedly.
          content:
            application/json:
              examples:
                not_allowed:
                  summary: No pending password update
                  value:
                    detail: This account cannot complete temporary-password sign-in.
                unavailable:
                  summary: Verification unavailable
                  value:
                    detail: Temporary-password verification is unavailable.
                invalid_response:
                  summary: Unexpected Keycloak answer
                  value:
                    detail: Keycloak returned an invalid temporary-password response.
              schema:
                $ref: '#/components/schemas/HTTPErrorResponse'
        '429':
          description: Too many attempts for this username or client address in the current window.
          content:
            application/json:
              examples:
                rate_limited:
                  summary: Rate limit reached
                  value:
                    detail: Too many temporary-password attempts. Try again later.
              schema:
                $ref: '#/components/schemas/HTTPErrorResponse'
        '500':
          description: The server has no Keycloak administrator credentials configured.
          content:
            application/json:
              examples:
                admin_credentials:
                  summary: Keycloak administrator credentials not configured
                  value:
                    detail: KEYCLOAK_ADMIN_USERNAME and KEYCLOAK_ADMIN_PASSWORD are required.
              schema:
                $ref: '#/components/schemas/HTTPErrorResponse'
        '502':
          description: The server could not authenticate to the Keycloak admin API.
          content:
            application/json:
              examples:
                admin_auth:
                  summary: Keycloak administrator sign-in failed
                  value:
                    detail: Unable to authenticate to Keycloak.
              schema:
                $ref: '#/components/schemas/HTTPErrorResponse'
        '403':
          description: The tenant is not active.
          content:
            application/json:
              examples:
                tenant_inactive:
                  summary: Tenant suspended or not yet active
                  value:
                    detail: Tenant is not active.
              schema:
                $ref: '#/components/schemas/HTTPErrorResponse'
        '404':
          description: No tenant has this slug.
          content:
            application/json:
              examples:
                tenant_not_found:
                  summary: Unknown tenant
                  value:
                    detail: Tenant not found.
              schema:
                $ref: '#/components/schemas/HTTPErrorResponse'
        '503':
          description: 'The tenant is in maintenance for an embedding migration (sent with `Retry-After:
            300`). Or the challenge store (Redis) is unavailable.'
          content:
            application/json:
              examples:
                maintenance:
                  summary: Tenant in embedding-migration maintenance
                  value:
                    detail: Tenant is in maintenance for embedding migration. Try again after completion.
                store_unavailable:
                  summary: Challenge store unavailable
                  value:
                    detail: Temporary-password sign-in is temporarily unavailable.
              schema:
                $ref: '#/components/schemas/HTTPErrorResponse'
          headers:
            Retry-After:
              description: 'Sent with the embedding-migration maintenance error: seconds to wait (300).'
              schema:
                type: integer
        '422':
          description: The request body or parameters failed validation. `detail` lists one entry per
            invalid value with its location (`loc`), message (`msg`), error `type` and the rejected `input`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail:
                - type: missing
                  loc:
                  - body
                  - username
                  msg: Field required
                  input: {}
      security: []
      x-galene-audience: public-auth
      x-galene-permissions: []
      x-galene-roles: []
  /public/tenants/{tenant_slug}/auth/temporary-password/complete:
    post:
      tags:
      - Authentication
      summary: Replace a tenant temporary password
      description: 'Second step of replacing a temporary password: consume `challenge_token` (it only
        works for the tenant that issued it), set `new_password` in Keycloak, then sign in with it as
        `POST /public/tenants/{tenant_slug}/auth/login` does and return the tokens. No authentication
        is required.


        The challenge token is consumed as soon as it is checked, so it cannot be reused even when a later
        step fails: when Keycloak rejects the new password (422), start again with the challenge step.
        When the sign-in fails after the password was changed (for example because the user is disabled),
        the password stays changed and the error is returned as is: sign in with `POST /public/tenants/{tenant_slug}/auth/login`
        and the new password.'
      operationId: complete_tenant_temporary_password_update_public_tenants__tenant_slug__auth_temporary_password_complete_post
      parameters:
      - name: tenant_slug
        in: path
        required: true
        schema:
          type: string
          description: Slug of the tenant, as used in its URLs.
          examples:
          - acme
          title: Tenant Slug
        description: Slug of the tenant, as used in its URLs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantTemporaryPasswordCompleteRequest'
      responses:
        '200':
          description: Tenant session tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
              example:
                access_token: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.EXAMPLE.SIGNATURE
                refresh_token: eyJhbGciOiJIUzUxMiIsInR5cCI6IkpXVCJ9.EXAMPLE-REFRESH.SIGNATURE
                expires_in: 300
                refresh_expires_in: 1800
                token_type: Bearer
                scope: openid profile email
                user:
                  user_id: 5f0c8a52-7d3e-4b1a-9c2e-000000000201
                  first_name: John
                  last_name: Smith
                  email: john.smith@example.com
                  organization_id: null
                  inference_language: en
                  avatar_url: null
                  avatar_mime_type: null
                  avatar_size_bytes: null
                  avatar_updated_at: null
                  roles:
                  - user
                  permissions:
                  - agent.create
                  - agent.list
                  - session.create
                  - session.list
                  tenant_slug: acme
                  controlplane: false
        '401':
          description: 'The challenge token is unknown, used, expired or issued for another tenant (the
            password is unchanged), or the sign-in after the password change failed: Keycloak rejected
            the credentials or the issued token.'
          content:
            application/json:
              examples:
                invalid_credentials:
                  summary: Wrong credentials or rejected token
                  value:
                    detail: Invalid credentials.
                challenge_expired:
                  summary: Unknown, used or expired challenge token
                  value:
                    detail: First sign-in verification expired. Start again.
                invalid_token:
                  summary: Keycloak rejected the issued access token
                  value:
                    detail: Invalid or expired token.
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '403':
          description: The tenant is not active, or the user is disabled or has no account in the tenant
            (an account that an SSO or directory connector cannot create on first sign-in).
          content:
            application/json:
              examples:
                tenant_inactive:
                  summary: Tenant suspended or not yet active
                  value:
                    detail: Tenant is not active.
                user_inactive:
                  summary: Tenant user disabled or unknown
                  value:
                    detail: Tenant user is not active.
              schema:
                $ref: '#/components/schemas/HTTPErrorResponse'
        '404':
          description: No tenant has this slug.
          content:
            application/json:
              examples:
                tenant_not_found:
                  summary: Unknown tenant
                  value:
                    detail: Tenant not found.
              schema:
                $ref: '#/components/schemas/HTTPErrorResponse'
        '409':
          description: The user signs in through an SSO or directory connector for the first time and
            their email already belongs to another tenant account.
          content:
            application/json:
              examples:
                sso_email_conflict:
                  summary: SSO identity collides with another account
                  value:
                    detail: This SSO identity matches an existing tenant email but is linked to a different
                      account. Ask a tenant administrator to verify and reconcile the identity.
              schema:
                $ref: '#/components/schemas/HTTPErrorResponse'
        '503':
          description: 'The tenant is in maintenance for an embedding migration (sent with `Retry-After:
            300`). Or the challenge store (Redis) is unavailable, or the tenant''s sign-in flows could
            not be prepared in Keycloak.'
          content:
            application/json:
              examples:
                maintenance:
                  summary: Tenant in embedding-migration maintenance
                  value:
                    detail: Tenant is in maintenance for embedding migration. Try again after completion.
                store_unavailable:
                  summary: Challenge store unavailable
                  value:
                    detail: Temporary-password sign-in is temporarily unavailable.
                sign_in_unavailable:
                  summary: Tenant sign-in flows could not be prepared
                  value:
                    detail: Tenant sign-in is temporarily unavailable.
              schema:
                $ref: '#/components/schemas/HTTPErrorResponse'
          headers:
            Retry-After:
              description: 'Sent with the embedding-migration maintenance error: seconds to wait (300).'
              schema:
                type: integer
        '422':
          description: 'The body is invalid, or Keycloak refused the new password: it does not meet the
            password policy, the temporary password is no longer pending, or the update service is unavailable
            (`{"detail": "..."}` body).'
          content:
            application/json:
              examples:
                validation:
                  summary: Invalid body
                  value:
                    detail:
                    - type: string_too_short
                      loc:
                      - body
                      - challenge_token
                      msg: String should have at least 32 characters
                      input: too-short
                      ctx:
                        min_length: 32
                password_policy:
                  summary: Password policy not met
                  value:
                    detail: New password does not meet Keycloak requirements.
                not_pending:
                  summary: Temporary password no longer pending
                  value:
                    detail: The temporary password is no longer available. Start sign-in again.
                update_unavailable:
                  summary: Password update unavailable
                  value:
                    detail: Temporary-password update is unavailable.
              schema:
                anyOf:
                - $ref: '#/components/schemas/ValidationErrorResponse'
                - $ref: '#/components/schemas/HTTPErrorResponse'
                title: Response 422 Complete Tenant Temporary Password Update Public Tenants  Tenant Slug  Auth
                  Temporary Password Complete Post
        '500':
          description: The server has no Keycloak administrator credentials configured.
          content:
            application/json:
              examples:
                admin_credentials:
                  summary: Keycloak administrator credentials not configured
                  value:
                    detail: KEYCLOAK_ADMIN_USERNAME and KEYCLOAK_ADMIN_PASSWORD are required.
              schema:
                $ref: '#/components/schemas/HTTPErrorResponse'
        '502':
          description: The Keycloak admin API sign-in failed, or the token endpoint returned an unexpected
            error.
          content:
            application/json:
              examples:
                admin_auth:
                  summary: Keycloak administrator sign-in failed
                  value:
                    detail: Unable to authenticate to Keycloak.
                token_exchange:
                  summary: Keycloak token endpoint failed
                  value:
                    detail: Keycloak token exchange failed.
              schema:
                $ref: '#/components/schemas/HTTPErrorResponse'
      security: []
      x-galene-audience: public-auth
      x-galene-permissions: []
      x-galene-roles: []
  /tenant/application-service-resources:
    get:
      tags:
      - Application Service Resources
      summary: List application service resources you can delegate
      description: 'List tenant-local resources that this installer can delegate to an application, with
        kind and maximum binding access.


        Requires tenant user authentication and either `application.install` or `application.update`.
        Core intersects current filesystem/connector ACLs with their delegation permissions, and notification
        recipient selection with user-update authority. Resources outside that authority are omitted.


        The unpaginated result includes available filesystems, external database connectors, MCP connectors
        and active recipients. Only filesystems can expose read_write. The response returns no credentials
        and grants nothing: approve manifest service roles and submit explicit resource bindings during
        installation/update. Availability and authority are rechecked when binding and executing.'
      operationId: tenant_resources_tenant_application_service_resources_get
      responses:
        '200':
          description: Tenant-local resource options; selection alone does not approve a service or create
            a binding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WSResponse_list_ApplicationServiceResourceResponse__'
              example:
                success: true
                message: Application service resources
                result:
                - id: 5f0c8a52-7d3e-4b1a-9c2e-000000000011
                  name: Report workspace
                  kind: filesystem
                  access: read_write
                - id: 5f0c8a52-7d3e-4b1a-9c2e-000000000012
                  name: Reporting database
                  kind: db_connector
                  access: read
                - id: 5f0c8a52-7d3e-4b1a-9c2e-000000000013
                  name: Case tools
                  kind: mcp_connector
                  access: read
                - id: 5f0c8a52-7d3e-4b1a-9c2e-000000000014
                  name: jane.doe@example.com
                  kind: notification_recipient
                  access: read
                total: 4
                next_cursor: null
        '401':
          description: 'Authentication failed: the `Authorization` header is missing; the tenant access
            token is invalid, expired, has no Keycloak issuer realm or does not identify a user; the tenant
            API key is invalid, disabled or revoked; the user does not exist in the tenant; or a Console
            session must first be confirmed with a one-time code (`detail.challenge` is `totp_required`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
              examples:
                missing_credentials:
                  summary: No Authorization header
                  value:
                    detail: Bearer token or API key required.
                invalid_token:
                  summary: Invalid or expired access token
                  value:
                    detail: Invalid or expired tenant token.
                invalid_api_key:
                  summary: Unknown or malformed API key
                  value:
                    detail: Invalid tenant API key.
                revoked_api_key:
                  summary: Disabled or revoked API key
                  value:
                    detail: Tenant API key is disabled or revoked.
                totp_required:
                  summary: Console session needs a one-time code
                  value:
                    detail:
                      challenge: totp_required
                      message: Sign in with your one-time code to continue.
                      mfa_required: true
                      supported_methods:
                      - totp
        '403':
          description: 'Access denied: the caller lacks the permission listed in `x-galene-permissions`
            (`Permission required: <permission>`), the tenant is not active, the tenant user is inactive,
            or the `X-Tenant` header does not match the tenant of the credential.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPErrorResponse'
              examples:
                permission_missing:
                  summary: Missing permission
                  value:
                    detail: 'Permission required: agent.update'
                tenant_inactive:
                  summary: Tenant is suspended or not yet active
                  value:
                    detail: Tenant is not active.
                user_inactive:
                  summary: Tenant user is disabled
                  value:
                    detail: Tenant user is inactive.
                tenant_header_mismatch:
                  summary: X-Tenant does not match the credential
                  value:
                    detail: Explicit tenant header does not match token realm.
        '503':
          description: 'The tenant is temporarily unavailable: an embedding migration has put it in maintenance
            (sent with `Retry-After: 300`), or the Console MFA policy or session state could not be read.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPErrorResponse'
              example:
                detail: Tenant is in maintenance for embedding migration. Try again after completion.
        '404':
          description: The authenticated tenant was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPErrorResponse'
              example:
                detail: Tenant not found.
