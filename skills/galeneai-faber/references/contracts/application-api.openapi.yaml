          title: Status
          description: '`uploading` (waiting for parts and completion), `queued`, `importing`, `awaiting_selection`
            (choose images with `select-image` or `select-images`), `cancel_requested`, or a final state:
            `ready` (version published), `failed` (see `error_message`; `retry` resumes it when the upload
