    AuthChallengeResponse:
      properties:
        challenge:
          type: string
          title: Challenge
          description: 'Next step: `totp_required` (repeat the call with a one-time code), `totp_setup_required`
            (enroll an authenticator with `otp_uri`, confirm it with `setup_token`, then sign in again),
            `password_update_required` (replace the temporary password through the temporary-password
            endpoints) or `sign_in_required` (sign in again).'
        message:
          type: string
          title: Message
          description: Human-readable instruction for the user.
        mfa_required:
          type: boolean
          title: Mfa Required
          description: Whether a one-time code is part of this sign-in.
          default: false
        supported_methods:
          items:
            type: string
          type: array
          title: Supported Methods
          description: Supported second factors (`totp`).
        setup_token:
          anyOf:
          - type: string
          - type: 'null'
          title: Setup Token
          description: '`totp_setup_required` only: single-use token for the first-login OTP verification
            endpoint. Keep it secret.'
        challenge_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Challenge Id
          description: '`totp_setup_required` only: identifier of the OTP setup challenge.'
        otp_uri:
          anyOf:
          - type: string
          - type: 'null'
          title: Otp Uri
          description: '`totp_setup_required` only: `otpauth://totp/...` URI with the TOTP secret to enroll
            in an authenticator app.'
        label:
          anyOf:
          - type: string
          - type: 'null'
          title: Label
          description: '`totp_setup_required` only: label of the OTP device.'
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Expires At
          description: '`totp_setup_required` only: when `setup_token` expires.'
        password_updated:
          type: boolean
          title: Password Updated
          description: '`true` when a temporary password was already replaced and only the sign-in that
            followed failed. Sign in with the new password.'
          default: false
      type: object
      required:
      - challenge
      - message
      title: AuthChallengeResponse
      description: Next step the client must complete to sign in.
      examples:
      - challenge: totp_required
        challenge_id: null
        expires_at: null
        label: null
        message: A one-time authentication code is required.
        mfa_required: true
        otp_uri: null
        password_updated: false
        setup_token: null
        supported_methods:
        - totp
      - challenge: totp_setup_required
        challenge_id: 5f0c8a52-7d3e-4b1a-9c2e-000000000801
        expires_at: '2026-09-27T09:40:00Z'
        label: Console
        message: Set up an authenticator before signing in to the Console.
        mfa_required: true
        otp_uri: otpauth://totp/Acme%20Console%3Ajohn.smith%40example.com?secret=JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP&issuer=Acme+Console&algorithm=SHA1&digits=6&period=30
        password_updated: false
        setup_token: EXAMPLE-setup-token-not-a-real-value-000000000000000000000000000
        supported_methods:
        - totp
    AuthErrorResponse:
      properties:
        detail:
          anyOf:
          - type: string
          - $ref: '#/components/schemas/AuthChallengeResponse'
          title: Detail
          description: Text message, or a sign-in challenge object whose `challenge` field names the next
            step (`totp_required`, `totp_setup_required` or `password_update_required`).
      additionalProperties: false
      type: object
      required:
      - detail
      title: AuthErrorResponse
      description: 'Authentication error.


        `detail` is either a text message or, when a one-time code or account

        setup is required, a structured sign-in challenge.'
      examples:
      - detail: Bearer token or API key required.
      - detail:
          challenge: totp_required
          message: Sign in with your one-time code to continue.
          mfa_required: true
          supported_methods:
          - totp
    AuthLoginRequest:
      properties:
