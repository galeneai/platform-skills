  /public/tenants/{tenant_slug}/auth/login:
    post:
      tags:
      - Authentication
      summary: Sign in to a tenant
      description: 'Sign in to a tenant with a username and password (Keycloak direct access grant) and
        receive access and refresh tokens for the tenant API. No authentication is required. Every attempt,
        successful or not, is recorded in the tenant audit ledger.


        This is the general-purpose tenant sign-in for applications and integrations, and it checks the
        password only: the tenant''s Console MFA policy is not enforced, and the sign-in client uses a
        copy of the realm''s direct-grant flow without Keycloak''s standard one-time-code step, so `totp`
        is normally not needed. The Console signs in with `POST /public/tenants/{tenant_slug}/console/auth/login`,
        which enforces Console MFA. Each call first makes sure, in Keycloak, that the tenant''s sign-in
        clients use this flow (503 when that fails). An account with a temporary password gets a `password_update_required`
        challenge: continue with `POST /public/tenants/{tenant_slug}/auth/temporary-password/challenge`.


        Users of an enabled SSO or directory connector are created on first sign-in and their group memberships
        are synchronized.'
      operationId: login_tenant_public_tenants__tenant_slug__auth_login_post
      parameters:
      - name: tenant_slug
        in: path
        required: true
        schema:
          type: string
          description: Slug of the tenant, as used in its URLs.
          examples:
          - acme
          title: Tenant Slug
        description: Slug of the tenant, as used in its URLs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Tenant session tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
              example:
                access_token: eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.EXAMPLE.SIGNATURE
                refresh_token: eyJhbGciOiJIUzUxMiIsInR5cCI6IkpXVCJ9.EXAMPLE-REFRESH.SIGNATURE
                expires_in: 300
                refresh_expires_in: 1800
                token_type: Bearer
                scope: openid profile email
                user:
                  user_id: 5f0c8a52-7d3e-4b1a-9c2e-000000000201
                  first_name: John
                  last_name: Smith
                  email: john.smith@example.com
                  organization_id: null
                  inference_language: en
                  avatar_url: null
                  avatar_mime_type: null
                  avatar_size_bytes: null
                  avatar_updated_at: null
                  roles:
                  - user
                  permissions:
                  - agent.create
                  - agent.list
                  - session.create
                  - session.list
                  tenant_slug: acme
                  controlplane: false
        '429':
          description: Too many failed sign-in or one-time-code attempts for this account or client address
            in the current window (`AUTH_RATE_LIMIT_ACCOUNT`, `AUTH_RATE_LIMIT_CLIENT`, `AUTH_RATE_LIMIT_WINDOW_SECONDS`).
            Retry after `Retry-After` seconds.
          content:
            application/json:
              examples:
                rate_limited:
                  summary: Rate limit reached
                  value:
                    detail: Too many failed attempts. Try again later.
              schema:
                $ref: '#/components/schemas/HTTPErrorResponse'
          headers:
            Retry-After:
              description: Seconds until the exhausted failure counter expires.
              schema:
                type: integer
        '401':
          description: The credentials are wrong, the temporary password must be replaced (`password_update_required`),
            Keycloak rejected the issued token, or a customized realm flow reported that a one-time code
            is required (`totp_required`).
          content:
            application/json:
              examples:
                invalid_credentials:
                  summary: Wrong credentials or rejected token
                  value:
                    detail: Invalid credentials.
                password_update_required:
                  summary: Temporary password must be replaced
                  value:
                    detail:
                      challenge: password_update_required
                      message: Complete your account setup.
                invalid_token:
                  summary: Keycloak rejected the issued access token
                  value:
                    detail: Invalid or expired token.
                totp_required:
                  summary: Customized realm flow asks for a one-time code
                  value:
                    detail:
                      challenge: totp_required
                      message: A one-time authentication code is required.
                      mfa_required: true
                      supported_methods:
                      - totp
                      setup_token: null
                      challenge_id: null
                      otp_uri: null
                      label: null
                      expires_at: null
                      password_updated: false
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '403':
          description: The tenant is not active, or the user is disabled or has no account in the tenant
            (an account that an SSO or directory connector cannot create on first sign-in).
          content:
            application/json:
              examples:
                tenant_inactive:
                  summary: Tenant suspended or not yet active
                  value:
                    detail: Tenant is not active.
                user_inactive:
                  summary: Tenant user disabled or unknown
                  value:
                    detail: Tenant user is not active.
              schema:
                $ref: '#/components/schemas/HTTPErrorResponse'
        '404':
          description: No tenant has this slug.
          content:
            application/json:
              examples:
                tenant_not_found:
                  summary: Unknown tenant
                  value:
                    detail: Tenant not found.
              schema:
                $ref: '#/components/schemas/HTTPErrorResponse'
        '409':
          description: The user signs in through an SSO or directory connector for the first time and
            their email already belongs to another tenant account.
          content:
            application/json:
              examples:
                sso_email_conflict:
                  summary: SSO identity collides with another account
                  value:
                    detail: This SSO identity matches an existing tenant email but is linked to a different
                      account. Ask a tenant administrator to verify and reconcile the identity.
              schema:
                $ref: '#/components/schemas/HTTPErrorResponse'
        '503':
          description: 'The tenant is in maintenance for an embedding migration (sent with `Retry-After:
            300`). Or the tenant''s sign-in flows could not be prepared in Keycloak.'
          content:
            application/json:
              examples:
                maintenance:
                  summary: Tenant in embedding-migration maintenance
                  value:
                    detail: Tenant is in maintenance for embedding migration. Try again after completion.
                sign_in_unavailable:
                  summary: Tenant sign-in flows could not be prepared
                  value:
                    detail: Tenant sign-in is temporarily unavailable.
              schema:
                $ref: '#/components/schemas/HTTPErrorResponse'
          headers:
            Retry-After:
              description: 'Sent with the embedding-migration maintenance error: seconds to wait (300).'
              schema:
                type: integer
        '502':
          description: The Keycloak token endpoint returned an unexpected error.
          content:
            application/json:
              examples:
                token_exchange:
                  summary: Keycloak token endpoint failed
                  value:
