  /controlplane/application-manifests/validate:
    post:
      tags:
      - Control Plane Applications
      summary: Validate an application package version manifest
      description: 'Check a version manifest with the rules of `POST /controlplane/applications/{package_id}/versions`,
        without storing anything.


        Requires a control-plane access token or API key with the `controlplane.applications.manage` permission
        (roles `controlplane_admin` and `controlplane_app_publisher`; control-plane API keys always have
        it).


        Returns 200 with `valid: true` when the version could be published, and 422 with `valid: false`
        and one entry per problem otherwise; a body that is not JSON or not an object is reported the
        same way. Besides the manifest schema, it checks that `package_slug` is a valid slug equal to
        `manifest.app.slug`, that every `image_source` registry source exists and that internal-registry
        images are pinned by digest. It does not check that the package exists or that the version is
        new.'
