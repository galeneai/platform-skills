  /controlplane/application-archive-imports/{import_id}/cancel:
    post:
      tags:
      - Control Plane Application Archive Imports
      summary: Cancel an application archive import
      description: 'Cancel an import that is not finished.


        Requires a control-plane access token or API key with the `controlplane.applications.manage` permission
        (roles `controlplane_admin` and `controlplane_app_publisher`; control-plane API keys always have
        it).


        An `uploading` import is cancelled at once (its multipart upload is aborted), and so is one `awaiting_selection`
        (its staged archive is deleted). For a `queued` or `importing` import the status becomes `cancel_requested`
        and the workflow is asked to stop; poll the import until it is `cancelled`. If the workflow cannot
        be reached the request is still recorded (see `error_message`) and the worker honors it. Cancelling
        a cancelled import returns it unchanged; `ready` and `failed` imports cannot be cancelled.'
      operationId: cancel_import_controlplane_application_archive_imports__import_id__cancel_post
      parameters:
      - name: import_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Id of the archive import.
          examples:
          - 5f0c8a52-7d3e-4b1a-9c2e-0000000000b0
