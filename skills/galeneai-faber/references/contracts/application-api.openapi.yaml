          description: Canonical `provider:model` id of the embedding model.
        provider:
          type: string
          title: Provider
          description: Provider part of `public_model_id`.
        model:
          type: string
          title: Model
          description: Model part of `public_model_id`.
        dimensions:
          type: integer
          exclusiveMinimum: 0.0
          title: Dimensions
          description: Vector dimensions of the space.
        generation:
          type: string
          format: uuid
          title: Generation
          description: Generation id of the active space; changes on every embedding migration.
        fingerprint:
          type: string
          minLength: 1
          title: Fingerprint
          description: Fingerprint of the embedding identity.
        semantic_validated:
          type: boolean
          const: true
          title: Semantic Validated
