          items:
            type: string
          type: array
          title: Depends On
          description: Other components of the manifest this component depends on; unique names, not itself.
          examples:
          - - api
      additionalProperties: false
      type: object
      title: ApplicationConnectivitySpec
      description: Declared local component dependencies.
    ApplicationDatabaseResourceSpec:
      properties:
        name:
          type: string
          title: Name
          description: 'Resource name: lowercase letters, digits and hyphens, unique in the manifest.'
          examples:
          - main
        engine:
          type: string
          const: postgresql
          title: Engine
          description: Database engine; only `postgresql`.
          default: postgresql
        extensions:
          items:
            type: string
          type: array
          title: Extensions
          description: PostgreSQL extensions to enable (unique identifiers). Default `["pgcrypto"]`.
        target_components:
          items:
            type: string
          type: array
          title: Target Components
          description: Components that receive the connection variables (unique names). When empty, the
            `backend` and `worker` components receive them, or every component when the manifest has none.
        env_prefix:
          type: string
          title: Env Prefix
          description: Prefix of the injected `<prefix>_HOST`, `<prefix>_PORT`, `<prefix>_NAME`, `<prefix>_USER`
            and `<prefix>_PASSWORD` variables. Default `APP_DB`.
          default: APP_DB
          examples:
          - HELPDESK_DB
        url_env:
          type: string
          title: Url Env
          description: Variable that receives the connection URL. Default `DATABASE_URL`.
          default: DATABASE_URL
          examples:
          - HELPDESK_DATABASE_URL
        retain_on_uninstall:
          type: boolean
          title: Retain On Uninstall
          description: Keep the database when the application is uninstalled. Default true.
          default: true
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Description of the resource.
      type: object
      required:
      - name
      title: ApplicationDatabaseResourceSpec
      description: A PostgreSQL database that Core provisions for the application.
    ApplicationDeploymentStatus:
      type: string
      enum:
      - pending
      - installing
      - deployed
      - updating
      - degraded
      - failed
      - suspending
      - suspended
      - resuming
      - uninstalling
      - uninstalled
      title: ApplicationDeploymentStatus
    ApplicationDesiredStatus:
      type: string
      enum:
      - deployed
      - suspended
      - uninstalled
      title: ApplicationDesiredStatus
    ApplicationDomainOptionResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: Managed-domain catalog entry id; send it as `managed_domain_id`.
        host:
          type: string
          title: Host
          description: Hostname of the entry.
        display_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Display Name
          description: Optional display name of the entry.
      type: object
      required:
      - id
      - host
      title: ApplicationDomainOptionResponse
      description: Minimal tenant-scoped domain choice for application deployment flows.
      examples:
      - display_name: Acme Helpdesk
        host: helpdesk.acme.example.com
        id: 5f0c8a52-7d3e-4b1a-9c2e-000000000031
    ApplicationDomainStatus:
      type: string
      enum:
      - pending_validation
      - active
      - failed
      - suspended
      title: ApplicationDomainStatus
    ApplicationEnvValue:
      properties:
        component:
          type: string
          title: Component
          description: Name of the manifest component that declares the variable.
          examples:
          - web
        name:
          type: string
          title: Name
          description: Variable name, as declared in the component's `env_schema`.
          examples:
          - SUPPORT_EMAIL
        value:
          anyOf:
          - type: string
          - type: 'null'
          title: Value
          description: Plain value of a non-sensitive variable. Set either `value` or `secret_value`.
          examples:
          - support@example.com
        secret_value:
          anyOf:
          - type: string
            format: password
            writeOnly: true
          - type: 'null'
          title: Secret Value
          description: Value of a variable declared `sensitive`. It is kept in the secret store and never
            returned; responses show a `secret_reference_id` instead.
      type: object
      required:
      - component
      - name
      title: ApplicationEnvValue
      description: Value of one environment variable declared by a manifest component.
      examples:
      - component: web
        name: SUPPORT_EMAIL
        value: support@example.com
      - component: web
        name: SMTP_PASSWORD
        secret_value: EXAMPLE-not-a-real-password
    ApplicationEnvVarSpec:
      properties:
        name:
          type: string
          title: Name
          description: 'Variable name: letters, digits and underscores, not starting with a digit; unique
            within the component. Names generated by Core for capabilities, databases and model roles
            cannot be supplied by installers.'
          examples:
          - SUPPORT_EMAIL
        required:
          type: boolean
          title: Required
          description: Whether installers must supply a value when there is no `default`.
          default: false
        sensitive:
          type: boolean
          title: Sensitive
          description: 'Whether the value is a secret: installers send it as `secret_value`, it is kept
            in the secret store and never returned. Sensitive variables cannot have a `default`.'
          default: false
        default:
          anyOf:
          - type: string
          - type: 'null'
          title: Default
          description: Value used when the installer supplies none.
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Help text shown to installers.
      type: object
      required:
      - name
      title: ApplicationEnvVarSpec
      description: An environment variable of a component that installers can or must set.
    ApplicationEventType:
      type: string
      enum:
      - requested
      - reconciled
      - failed
      - status_changed
      - domain_changed
      - secret_rotated
      title: ApplicationEventType
    ApplicationFilesystemResourceSpec:
      properties:
        name:
          type: string
          title: Name
          description: 'Resource name: lowercase letters, digits and hyphens, unique in the manifest.'
          examples:
          - attachments
        read_only:
          type: boolean
          title: Read Only
          description: Whether the application only reads the filesystem.
          default: false
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Description of the resource.
      type: object
      required:
      - name
      title: ApplicationFilesystemResourceSpec
      description: A filesystem the application uses.
    ApplicationHealthSpec:
      properties:
        readiness_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Readiness Path
          description: Absolute HTTP path of the readiness probe, without query or fragment.
          examples:
          - /healthz
        liveness_path:
          anyOf:
          - type: string
          - type: 'null'
          title: Liveness Path
          description: Absolute HTTP path of the liveness probe, without query or fragment.
          examples:
          - /livez
        initial_delay_seconds:
          type: integer
          maximum: 300.0
          minimum: 0.0
          title: Initial Delay Seconds
          description: Seconds before the first probe (0-300).
          default: 5
        period_seconds:
          type: integer
          maximum: 300.0
          minimum: 1.0
          title: Period Seconds
          description: Seconds between probes (1-300).
          default: 10
        timeout_seconds:
          type: integer
          maximum: 60.0
          minimum: 1.0
          title: Timeout Seconds
          description: Probe timeout in seconds (1-60).
          default: 3
        failure_threshold:
          type: integer
          maximum: 20.0
          minimum: 1.0
          title: Failure Threshold
          description: Consecutive failures before the probe fails (1-20).
          default: 3
      additionalProperties: false
      type: object
      title: ApplicationHealthSpec
      description: HTTP health probes of a component.
    ApplicationImageSourceSpec:
      properties:
        registry_source_id:
          type: string
          format: uuid
          title: Registry Source Id
          description: Registry source that holds the image (see `GET /controlplane/registry-sources`).
        repository:
          anyOf:
          - type: string
          - type: 'null'
          title: Repository
          description: 'External sources: repository path inside the registry, for example `example-apps/helpdesk-web`.
            Must be omitted for the internal registry, whose tenant repositories are managed by the platform.'
          examples:
          - example-apps/helpdesk-web
        reference:
          type: string
          title: Reference
          description: Image tag or digest, for example `1.4.0` or `sha256:<64 hex digits>`. Images of
            the internal registry must be referenced by `sha256:` digest.
          examples:
          - 1.4.0
      type: object
      required:
      - registry_source_id
      - reference
      title: ApplicationImageSourceSpec
      description: A registry-source selection retained in an immutable application manifest.
    ApplicationJobConsentResponse:
      properties:
        job_id:
          type: string
          title: Job Id
          description: Core-owned application job UUID.
        status:
          type: string
          title: Status
          description: Current schedule state.
        expires_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Expires At
          description: Approved offline consent expiry.
        revoked:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Revoked
          description: True when future offline occurrences have been revoked.
      type: object
      required:
      - job_id
      - status
      title: ApplicationJobConsentResponse
      examples:
      - expires_at: '2026-10-04T18:00:00+00:00'
        job_id: f3625d90-fd87-4ed9-8e53-a66d6cb01ad0
        status: active
      - job_id: f3625d90-fd87-4ed9-8e53-a66d6cb01ad0
        revoked: true
        status: paused
    ApplicationJobReviewResponse:
      properties:
        job_id:
          type: string
          title: Job Id
          description: Core-owned application job UUID.
        name:
          type: string
          title: Name
          description: Application-supplied bounded job name.
        status:
          type: string
          title: Status
          description: Current schedule state.
        execution_mode:
          type: string
          title: Execution Mode
          description: Application or explicitly approved offline user execution.
        target_service_role:
          type: string
          title: Target Service Role
          description: Bound target logical service role.
        target_operation:
          type: string
          title: Target Operation
          description: Explicit target service operation.
        target_arguments:
          additionalProperties: true
          type: object
          title: Target Arguments
          description: Immutable operation arguments for user review.
        scope:
          additionalProperties: true
          type: object
          title: Scope
          description: Immutable authority scope to copy into an explicit approval.
        calendar:
          additionalProperties: true
          type: object
          title: Calendar
          description: Timezone-aware recurrence definition.
        offline_delegation:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Offline Delegation
          description: Current offline approval expiry and revocation state.
      additionalProperties: true
      type: object
      required:
      - job_id
      - name
      - status
      - execution_mode
      - target_service_role
      - target_operation
      - target_arguments
      - scope
      - calendar
      - offline_delegation
      title: ApplicationJobReviewResponse
      examples:
      - calendar:
          dtstart: '2026-10-03T09:00:00'
          exdates: []
          rdates: []
          rrules:
          - FREQ=DAILY
          timezone: Europe/Rome
        execution_mode: user
        job_id: f3625d90-fd87-4ed9-8e53-a66d6cb01ad0
        name: Daily search
        offline_delegation: null
        scope:
          operation: search
          resources: {}
          service_role: web
        status: pending_consent
        target_arguments:
          query: weather
        target_operation: search
        target_service_role: web
    ApplicationManifest:
      properties:
        schema_version:
          type: string
          const: '1.0'
          title: Schema Version
          description: Manifest schema version; only `1.0`.
          default: '1.0'
        app:
          $ref: '#/components/schemas/ApplicationManifestAppSpec'
        components:
          items:
            $ref: '#/components/schemas/ApplicationComponentSpec'
          type: array
          title: Components
          description: 'Containers of the application: at least one, with unique names.'
        routes:
          items:
            $ref: '#/components/schemas/ApplicationRouteSpec'
          type: array
          title: Routes
          description: Components reachable through hostname bindings.
        capabilities:
          items:
            $ref: '#/components/schemas/ApplicationCapabilitySpec'
          type: array
          title: Capabilities
          description: Platform capabilities the application asks for, unique by name.
        permissions:
          items:
            $ref: '#/components/schemas/ApplicationPermissionSpec'
          type: array
          title: Permissions
          description: Action permissions of the application, unique by name. Core also creates the `access`
            permission that controls who sees the application.
        filesystem_resources:
          items:
            $ref: '#/components/schemas/ApplicationFilesystemResourceSpec'
          type: array
          title: Filesystem Resources
          description: Filesystems the application uses, unique by name.
        database_resources:
          items:
            $ref: '#/components/schemas/ApplicationDatabaseResourceSpec'
          type: array
          title: Database Resources
          description: PostgreSQL databases Core provisions for the application, unique by name.
        model_requirements:
          anyOf:
          - items:
              $ref: '#/components/schemas/ApplicationModelRequirement'
            type: array
          - type: 'null'
          title: Model Requirements
          description: AI model roles the application needs, unique by role.
        service_requirements:
          items:
            $ref: '#/components/schemas/ApplicationServiceRequirement'
          type: array
          title: Service Requirements
          description: Core service roles; installation never grants them automatically.
        resource_requirements:
          items:
            $ref: '#/components/schemas/ApplicationResourceRequirement'
          type: array
          title: Resource Requirements
          description: Logical resource roles bound by the tenant installer.
        vfs:
          $ref: '#/components/schemas/ApplicationVfsSpec'
          description: Virtual-filesystem defaults.
        session_execution:
          anyOf:
          - $ref: '#/components/schemas/ApplicationSessionExecutionSpec'
          - type: 'null'
          description: Component that takes part in durable session execution, if any.
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
          description: Free-form metadata. The tenant application launcher reads `icon` and `accent_color`
            from it.
      type: object
      required:
      - app
      - components
      title: ApplicationManifest
      description: Deployment contract of one application version.
      examples:
      - app:
          name: Helpdesk
          requires_core: '>=1.2.0'
          slug: helpdesk
        capabilities:
        - name: core_api
          required: true
        components:
        - env_schema:
          - description: Sender of ticket notifications.
            name: SUPPORT_EMAIL
            required: true
          - name: SMTP_PASSWORD
            sensitive: true
          - name: HELPDESK_MODEL_ID
          health:
            readiness_path: /healthz
          image: registry.example.com/acme/helpdesk-web:1.4.0
          kind: frontend
          name: web
          port: 3000
          resources:
            cpu: 500m
            memory: 512Mi
        database_resources:
        - env_prefix: HELPDESK_DB
          name: main
          target_components:
          - web
          url_env: HELPDESK_DATABASE_URL
        metadata:
          accent_color: '#1f6feb'
        model_requirements:
        - env:
          - component: web
            name: HELPDESK_MODEL_ID
          role: assistant
          slot: llm
        permissions:
        - description: Assign tickets to agents
          name: tickets.assign
        routes:
        - component: web
          role: frontend
        schema_version: '1.0'
    ApplicationManifestAppSpec:
      properties:
        slug:
          type: string
          title: Slug
          description: Package slug; it must equal the slug of the package.
          examples:
          - helpdesk
        name:
          type: string
          title: Name
          description: Display name of the application.
          examples:
          - Helpdesk
        requires_core:
          anyOf:
          - type: string
          - type: 'null'
          title: Requires Core
          description: PEP 440 Core version constraint, enforced at publication, install, update and runtime
            reconciliation.
          examples:
          - '>=1.2.0'
      type: object
      required:
      - slug
      - name
      title: ApplicationManifestAppSpec
      description: Identity of the application.
    ApplicationManifestValidationIssue:
      properties:
        path:
          type: string
          title: Path
          description: Location of the problem, for example `manifest.components[0].port` or `package_slug`.
          examples:
          - manifest.components[0].port
        message:
          type: string
          title: Message
          description: Explanation. Failures of custom manifest rules (type `value_error` under `manifest`)
            use a generic message so that manifest values are never echoed back; the package slug, slug
            match and registry source checks give a specific message.
          examples:
          - Value does not satisfy a manifest validation rule.
        type:
          type: string
          title: Type
          description: Error type, for example `missing`, `extra_forbidden` or `value_error`.
          examples:
          - value_error
      type: object
      required:
      - path
      - message
      - type
      title: ApplicationManifestValidationIssue
      description: One manifest validation problem.
    ApplicationManifestValidationResponse:
      properties:
        valid:
          type: boolean
          title: Valid
          description: Whether the version could be published as submitted.
        errors:
          items:
            $ref: '#/components/schemas/ApplicationManifestValidationIssue'
          type: array
          title: Errors
          description: Problems found; empty when `valid` is true.
      type: object
      required:
      - valid
      title: ApplicationManifestValidationResponse
      description: Result of a manifest preflight.
      examples:
      - errors: []
        valid: true
      - errors:
        - message: Manifest app.slug must match the package slug
          path: manifest.app.slug
          type: value_error
        - message: Value does not satisfy a manifest validation rule.
          path: manifest.components[0]
          type: value_error
        valid: false
    ApplicationModelBinding:
      properties:
        source:
          type: string
          enum:
          - tenant_default
          - explicit
          title: Source
          description: '`tenant_default` uses the tenant''s default model for the role''s slot; `explicit`
            pins `model_id`.'
          default: tenant_default
        model_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Id
          description: Canonical `provider:model` id of a model visible to the tenant. Required with `explicit`,
            not allowed with `tenant_default`.
          examples:
          - openai:gpt-4o-mini
      additionalProperties: false
      type: object
      title: ApplicationModelBinding
      description: Model selected for one application model role.
      examples:
      - model_id: openai:gpt-4o-mini
        source: explicit
      - source: tenant_default
    ApplicationModelEnvTarget:
      properties:
        component:
          type: string
          title: Component
          description: Component that declares the variable.
          examples:
          - web
        name:
          type: string
          pattern: ^[A-Za-z_][A-Za-z0-9_]*$
          title: Name
          description: Variable declared in that component's `env_schema`, not sensitive and without a
            default; it receives the selected `provider:model` id.
          examples:
          - HELPDESK_MODEL_ID
      additionalProperties: false
      type: object
      required:
      - component
      - name
      title: ApplicationModelEnvTarget
      description: A component variable that receives the model selected for a role.
    ApplicationModelFeatureStatus:
      properties:
        model_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Id
          description: Resolved model id; null when the role is not ready.
        required:
          type: boolean
          title: Required
          description: Whether the manifest marks the role as required.
      additionalProperties: false
      type: object
      required:
      - required
      title: ApplicationModelFeatureStatus
      description: Legacy per-role summary kept for older clients.
      examples:
      - model_id: openai:gpt-4o-mini
        required: true
    ApplicationModelRequirement:
      properties:
        role:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,62}$
          title: Role
          description: 'Role name, unique in the manifest: a lowercase letter followed by up to 62 lowercase
            letters, digits, `_` or `-`.'
          examples:
          - assistant
        slot:
          type: string
          enum:
          - llm
          - embedding
          - stt
          title: Slot
          description: '`llm` for chat, `embedding` for vectors, or `stt` for transcription.'
        requirement:
          type: string
          enum:
          - required
          - optional
          title: Requirement
          description: '`required` (default) or `optional`.'
          default: required
        capabilities:
          items:
            type: string
            enum:
            - chat
            - embedding
            - transcription
          type: array
          title: Capabilities
          description: Model capabilities the role needs, unique; they must include the slot's capability
            (`chat`, `embedding` or `transcription`), which is also the default.
        input_modalities:
          items:
            type: string
            enum:
            - text
            - image
            - audio
          type: array
          minItems: 1
          title: Input Modalities
          description: Input modalities the model must accept, unique; stt defaults to audio, other slots
            default to text.
        env:
          items:
            $ref: '#/components/schemas/ApplicationModelEnvTarget'
          type: array
          title: Env
          description: Component variables that receive the selected model id.
      additionalProperties: false
      type: object
      required:
      - role
      - slot
      title: ApplicationModelRequirement
    ApplicationModelRoleStatus:
      properties:
        role:
          type: string
          pattern: ^[a-z][a-z0-9_-]{0,62}$
          title: Role
          description: 'Role name, unique in the manifest: a lowercase letter followed by up to 62 lowercase
            letters, digits, `_` or `-`.'
          examples:
          - assistant
        slot:
          type: string
          enum:
          - llm
          - embedding
          - stt
          title: Slot
          description: '`llm` for chat, `embedding` for vectors, or `stt` for transcription.'
        requirement:
          type: string
          enum:
          - required
          - optional
          title: Requirement
          description: '`required` (default) or `optional`.'
          default: required
        capabilities:
          items:
            type: string
            enum:
            - chat
            - embedding
            - transcription
          type: array
          title: Capabilities
          description: Model capabilities the role needs, unique; they must include the slot's capability
            (`chat`, `embedding` or `transcription`), which is also the default.
        input_modalities:
          items:
            type: string
            enum:
            - text
            - image
            - audio
          type: array
          minItems: 1
          title: Input Modalities
          description: Input modalities the model must accept, unique; stt defaults to audio, other slots
            default to text.
        env:
          items:
            $ref: '#/components/schemas/ApplicationModelEnvTarget'
          type: array
          title: Env
          description: Component variables that receive the selected model id.
        source:
          type: string
          enum:
          - tenant_default
          - explicit
          title: Source
          description: Whether the role uses the tenant default model or an explicit selection.
        requested_model_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Requested Model Id
          description: 'Model the role asks for: the explicit selection or the current tenant default;
            null when no default exists.'
        model_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Id
          description: Model the role resolves to; null when the role is not `ready`.
        catalog_ready:
          type: boolean
          title: Catalog Ready
          description: Whether the requested model is visible to the tenant and has the required capabilities
            and input modalities.
        ready:
          type: boolean
          title: Ready
          description: 'Whether the role can be used: `catalog_ready` and, for embedding roles, matching
            the tenant''s active embedding space.'
        code:
          anyOf:
          - type: string
          - type: 'null'
          title: Code
          description: Why the role is not ready, for example `MODEL_DEFAULT_MISSING`, `MODEL_NOT_ASSIGNED`,
            `MODEL_CAPABILITY_MISMATCH` or `EMBEDDING_SPACE_MISMATCH`; null when ready.
        active_embedding_space:
          anyOf:
          - $ref: '#/components/schemas/ApplicationActiveEmbeddingSpace'
          - type: 'null'
          description: The tenant's active embedding space, for embedding roles only.
        runtime_model_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Runtime Model Id
          description: Model id rendered into the application environment; it can be a previously rendered
            model while the role is not ready.
        runtime_retained:
          type: boolean
          title: Runtime Retained
          description: True when `runtime_model_id` is a retained earlier selection because the role is
            currently not ready.
          default: false
      additionalProperties: false
      type: object
      required:
      - role
      - slot
      - source
      - catalog_ready
      - ready
      title: ApplicationModelRoleStatus
      description: Resolution of one manifest model role against the tenant's model catalog.
      examples:
      - active_embedding_space: null
        capabilities:
        - chat
        catalog_ready: true
        code: null
        env:
        - component: web
          name: HELPDESK_MODEL_ID
        input_modalities:
        - text
        model_id: openai:gpt-4o-mini
        ready: true
        requested_model_id: openai:gpt-4o-mini
        requirement: required
        role: assistant
        runtime_model_id: openai:gpt-4o-mini
        runtime_retained: false
        slot: llm
        source: explicit
    ApplicationModelStatus:
      properties:
        schema_version:
          type: integer
          const: 1
          title: Schema Version
          description: Version of this structure.
          default: 1
        defaults:
          additionalProperties:
            type: string
