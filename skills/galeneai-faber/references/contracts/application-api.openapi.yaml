openapi: 3.1.0
info:
  title: Galene tenant application API excerpt
  version: 2d494cc2406d
  description: Application publication, installation, tenant sign-in and direct application service contracts
    exported from the exact Platform Core commit recorded in snapshot-lock.json. Unrelated Core APIs are
    omitted.
  x-platform-core-commit: 2d494cc2406de24b1c68d904c83e655d30e5a7e4
servers:
- url: /
paths:
  /application-jobs/{job_id}:
    get:
      tags:
      - Application jobs
      summary: Review an application job before offline consent
      description: 'Read the creator''s user-mode schedule, immutable target arguments, calendar and complete
        authority scope. The response includes the current offline consent expiry/revocation, or null
        when no consent exists.


        Requires ordinary tenant user authentication and `application_job.get`; application service tokens
        cannot call this route. The creator must retain current application access and the stored component
        credential/grant revision.


        Copy the entire returned scope into an explicit approval request. Reading the job neither approves
        offline execution nor starts an occurrence. Follow the returned child operation identities to
        distinguish schedule creation from actual target completion.'
      operationId: getApplicationJobConsent
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Core-owned user-mode job UUID created by the authenticated tenant user; returned
            by jobs.schedule.
          examples:
          - 5f0c8a52-7d3e-4b1a-9c2e-000000000003
          title: Job Id
        description: Core-owned user-mode job UUID created by the authenticated tenant user; returned
          by jobs.schedule.
      responses:
        '200':
          description: The creator's current schedule and immutable scope to review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationJobReviewResponse'
              example:
                job_id: 5f0c8a52-7d3e-4b1a-9c2e-000000000003
                name: Daily public report search
                status: pending_consent
                reason_code: null
                execution_mode: user
                target_service_role: research
                target_operation: search
                target_arguments:
                  query: public annual report
                  limit: 5
                calendar:
                  timezone: Europe/Rome
                  dtstart: '2026-10-04T09:00:00'
                  rrules:
                  - FREQ=DAILY;COUNT=7
                  rdates: []
                  exdates: []
                scope:
                  credential_id: 5f0c8a52-7d3e-4b1a-9c2e-000000000004
                  grant_revision: 1
                  service_role: research
                  service: web
                  operation: search
                  resources: {}
                next_due_at: '2026-10-04T07:00:00+00:00'
                overlap_policy: buffer_one
                misfire_policy: coalesce
                active_occurrence: null
                last_result: null
                callback: null
                offline_delegation: null
        '401':
          description: Tenant authentication failed, or the job's application credential was revoked or
            its grant revision changed.
          content:
            application/json:
              example:
                detail:
                  code: application_credential_revoked
                  message: Application credential is not active.
              schema:
                anyOf:
                - $ref: '#/components/schemas/AuthErrorResponse'
                - $ref: '#/components/schemas/CodedHTTPErrorResponse'
                title: Response 401 Getapplicationjobconsent
        '403':
          description: The user lacks the route permission/current app access, or the app/tenant is inactive
            or incompatible with this Core release.
          content:
            application/json:
              example:
                detail:
                  code: job_authority_revoked
                  message: Application access has been revoked
              schema:
                anyOf:
                - $ref: '#/components/schemas/HTTPErrorResponse'
                - $ref: '#/components/schemas/CodedHTTPErrorResponse'
                title: Response 403 Getapplicationjobconsent
        '503':
          description: Tenant maintenance, Console MFA availability, or the application's tenant storage
            authority prevents access.
          content:
            application/json:
              example:
                detail:
                  code: tenant_storage_unavailable
                  message: Tenant storage authority is unavailable.
              schema:
                anyOf:
                - $ref: '#/components/schemas/HTTPErrorResponse'
                - $ref: '#/components/schemas/CodedHTTPErrorResponse'
                title: Response 503 Getapplicationjobconsent
        '404':
          description: The authenticated tenant was not found, or the job is deleted, belongs to another
            user, or is outside this tenant/deployment/component.
          content:
            application/json:
              example:
                detail:
                  code: job_not_found
                  message: User application job was not found
              schema:
                anyOf:
                - $ref: '#/components/schemas/HTTPErrorResponse'
                - $ref: '#/components/schemas/CodedHTTPErrorResponse'
                title: Response 404 Getapplicationjobconsent
        '422':
          description: The request body or parameters failed validation. `detail` lists one entry per
            invalid value with its location (`loc`), message (`msg`), error `type` and the rejected `input`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail:
                - type: uuid_parsing
                  loc:
                  - path
                  - job_id
                  msg: 'Input should be a valid UUID, invalid character: found `n` at 1'
                  input: not-a-uuid
                  ctx:
                    error: 'invalid character: found `n` at 1'
      security:
      - TenantBearer: []
      - TenantApiKey: []
      x-galene-audience: tenant-public
      x-galene-permissions:
      - application_job.get
      x-galene-roles: []
  /application-jobs/{job_id}/approve:
    post:
      tags:
      - Application jobs
      summary: Approve limited offline execution of an application job
      description: 'Record or renew the creator''s explicit, revocable offline consent for this schedule
        without storing a bearer token. Send the exact complete scope reviewed with GET /application-jobs/{job_id},
        including credential, grant revision and bound resources.


        Requires ordinary tenant user authentication and `application_job.approve`, current application
        access, an approved user-mode target operation, and current ACLs for every bound resource. Application
        service tokens cannot approve consent.


        The expiry must include a timezone and be between one minute and 30 days from approval. Changed
        reviewed/current scope returns 409; reload and review it again. Success stores the consent, clears
        an old revocation/reason and marks the job active, then wakes its workflow. The 200 response confirms
        approval, not a completed occurrence; poll the job and its child service operation for progress.'
      operationId: approveApplicationJobConsent
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Core-owned user-mode job UUID created by the authenticated tenant user; returned
            by jobs.schedule.
          examples:
          - 5f0c8a52-7d3e-4b1a-9c2e-000000000003
          title: Job Id
        description: Core-owned user-mode job UUID created by the authenticated tenant user; returned
          by jobs.schedule.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveApplicationJobRequest'
            example:
              expires_at: '2026-10-05T18:00:00Z'
              scope:
                credential_id: 5f0c8a52-7d3e-4b1a-9c2e-000000000004
                grant_revision: 1
                service_role: research
                service: web
                operation: search
                resources: {}
      responses:
        '200':
          description: Consent was stored and the schedule was activated; target work remains asynchronous.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationJobConsentResponse'
              example:
                job_id: 5f0c8a52-7d3e-4b1a-9c2e-000000000003
                status: active
                expires_at: '2026-10-05T18:00:00+00:00'
                revoked: null
        '401':
          description: Tenant authentication failed, or the job's application credential was revoked or
            its grant revision changed.
          content:
            application/json:
              example:
                detail:
                  code: application_credential_revoked
                  message: Application credential is not active.
              schema:
                anyOf:
                - $ref: '#/components/schemas/AuthErrorResponse'
                - $ref: '#/components/schemas/CodedHTTPErrorResponse'
                title: Response 401 Approveapplicationjobconsent
        '403':
          description: Tenant/user permission or application authority failed; the target service/mode/operation
            or current bound resource access is denied.
          content:
            application/json:
              example:
                detail:
                  code: resource_access_denied
                  message: User lacks the required filesystem authority.
              schema:
                anyOf:
                - $ref: '#/components/schemas/HTTPErrorResponse'
                - $ref: '#/components/schemas/CodedHTTPErrorResponse'
                title: Response 403 Approveapplicationjobconsent
        '503':
          description: Tenant maintenance, Console MFA availability, or the application's tenant storage
            authority prevents access.
          content:
            application/json:
              example:
                detail:
                  code: tenant_storage_unavailable
                  message: Tenant storage authority is unavailable.
              schema:
                anyOf:
                - $ref: '#/components/schemas/HTTPErrorResponse'
                - $ref: '#/components/schemas/CodedHTTPErrorResponse'
                title: Response 503 Approveapplicationjobconsent
        '404':
          description: The authenticated tenant was not found, or the job is deleted, belongs to another
            user, or is outside this tenant/deployment/component.
          content:
            application/json:
              example:
                detail:
                  code: job_not_found
                  message: User application job was not found
              schema:
                anyOf:
                - $ref: '#/components/schemas/HTTPErrorResponse'
                - $ref: '#/components/schemas/CodedHTTPErrorResponse'
                title: Response 404 Approveapplicationjobconsent
        '409':
          description: The submitted scope differs from the immutable job scope or the current grant/resources;
            a target resource role is no longer configured.
          content:
            application/json:
              example:
                detail:
                  code: job_scope_changed
                  message: Reviewed job scope does not match the job
              schema:
                $ref: '#/components/schemas/CodedHTTPErrorResponse'
        '422':
          description: Body/path validation failed, consent expiry is naive or outside one minute–30 days,
            or the stored target/resource kind/access is invalid.
          content:
            application/json:
              example:
                detail:
                  code: invalid_delegation_expiry
                  message: Consent expiry must be between one minute and 30 days from now
              schema:
                anyOf:
                - $ref: '#/components/schemas/ValidationErrorResponse'
                - $ref: '#/components/schemas/CodedHTTPErrorResponse'
                title: Response 422 Approveapplicationjobconsent
      security:
      - TenantBearer: []
      - TenantApiKey: []
      x-galene-audience: tenant-public
      x-galene-permissions:
      - application_job.approve
      x-galene-roles: []
  /application-jobs/{job_id}/revoke:
    post:
      tags:
      - Application jobs
      summary: Revoke future offline application job execution
      description: 'Revoke this creator''s stored offline consent and clear buffered work. A nondeleted
        schedule becomes paused with reason offline_delegation_revoked; a deleted schedule remains deleted.


        Requires ordinary tenant user authentication and `application_job.revoke`. Only the creator of
        a user-mode job can revoke it. This remains available after application access or component credentials
        are removed.


        Repeating the request leaves consent revoked and returns the current paused/deleted state. The
        workflow is notified after persistence; queued child effects recheck consent before acting. Already
        completed effects are not undone.'
      operationId: revokeApplicationJobConsent
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Core-owned user-mode job UUID created by the authenticated tenant user; returned
            by jobs.schedule.
          examples:
          - 5f0c8a52-7d3e-4b1a-9c2e-000000000003
          title: Job Id
        description: Core-owned user-mode job UUID created by the authenticated tenant user; returned
          by jobs.schedule.
      responses:
        '200':
          description: Offline consent is revoked and buffered occurrences are cleared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationJobConsentResponse'
              example:
                job_id: 5f0c8a52-7d3e-4b1a-9c2e-000000000003
                status: paused
                expires_at: null
                revoked: true
        '401':
          description: 'Authentication failed: the `Authorization` header is missing; the tenant access
            token is invalid, expired, has no Keycloak issuer realm or does not identify a user; the tenant
            API key is invalid, disabled or revoked; the user does not exist in the tenant; or a Console
            session must first be confirmed with a one-time code (`detail.challenge` is `totp_required`).'
          content:
            application/json:
              examples:
                missing_credentials:
                  summary: No Authorization header
                  value:
                    detail: Bearer token or API key required.
                invalid_token:
                  summary: Invalid or expired access token
                  value:
                    detail: Invalid or expired tenant token.
                invalid_api_key:
                  summary: Unknown or malformed API key
                  value:
                    detail: Invalid tenant API key.
                revoked_api_key:
                  summary: Disabled or revoked API key
                  value:
                    detail: Tenant API key is disabled or revoked.
                totp_required:
                  summary: Console session needs a one-time code
                  value:
                    detail:
                      challenge: totp_required
                      message: Sign in with your one-time code to continue.
                      mfa_required: true
                      supported_methods:
                      - totp
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '403':
          description: 'Access denied: the caller lacks the permission listed in `x-galene-permissions`
            (`Permission required: <permission>`), the tenant is not active, the tenant user is inactive,
            or the `X-Tenant` header does not match the tenant of the credential.'
          content:
            application/json:
              examples:
                permission_missing:
                  summary: Missing permission
                  value:
                    detail: 'Permission required: agent.update'
                tenant_inactive:
                  summary: Tenant is suspended or not yet active
                  value:
                    detail: Tenant is not active.
                user_inactive:
                  summary: Tenant user is disabled
                  value:
                    detail: Tenant user is inactive.
                tenant_header_mismatch:
                  summary: X-Tenant does not match the credential
                  value:
                    detail: Explicit tenant header does not match token realm.
              schema:
                $ref: '#/components/schemas/HTTPErrorResponse'
        '503':
          description: 'The tenant is temporarily unavailable: an embedding migration has put it in maintenance
            (sent with `Retry-After: 300`), or the Console MFA policy or session state could not be read.'
          content:
            application/json:
              example:
                detail: Tenant is in maintenance for embedding migration. Try again after completion.
              schema:
                $ref: '#/components/schemas/HTTPErrorResponse'
        '404':
          description: The authenticated tenant was not found, or the current user is not the creator
            of this user-mode job.
          content:
            application/json:
              example:
                detail:
                  code: job_not_found
                  message: User application job was not found
              schema:
                anyOf:
                - $ref: '#/components/schemas/HTTPErrorResponse'
                - $ref: '#/components/schemas/CodedHTTPErrorResponse'
                title: Response 404 Revokeapplicationjobconsent
        '422':
          description: The request body or parameters failed validation. `detail` lists one entry per
            invalid value with its location (`loc`), message (`msg`), error `type` and the rejected `input`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail:
                - type: uuid_parsing
                  loc:
                  - path
                  - job_id
                  msg: 'Input should be a valid UUID, invalid character: found `n` at 1'
                  input: not-a-uuid
                  ctx:
                    error: 'invalid character: found `n` at 1'
      security:
      - TenantBearer: []
      - TenantApiKey: []
      x-galene-audience: tenant-public
      x-galene-permissions:
      - application_job.revoke
      x-galene-roles: []
  /application-notifications:
    get:
      tags:
      - Application notifications
      summary: List your application notification inbox
      description: 'List real internal application-operation notification records addressed to the authenticated
        tenant user, newest first. Each record contains its notification/delivery ID, originating operation
        ID, content and recipient read state.


        Requires ordinary tenant user authentication and `notification.list`; application service credentials
        do not grant inbox access.


        Return at most limit records (1–100, default 100). There is no cursor or total, so this bounded
        result is not a complete history. Only internal inbox records are listed; an SMTP send result
        does not establish a mailbox receipt. Reading the list does not mark records read.'
      operationId: listApplicationNotifications
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Maximum recent notification records to return; no pagination cursor is provided.
          examples:
          - 20
          default: 100
          title: Limit
        description: Maximum recent notification records to return; no pagination cursor is provided.
      responses:
        '200':
          description: Recent application notifications for the current recipient only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationNotificationInbox'
              example:
                notifications:
                - notification_id: 5f0c8a52-7d3e-4b1a-9c2e-000000000005
                  operation_id: 5f0c8a52-7d3e-4b1a-9c2e-000000000006
                  title: Report ready
                  body: The approved report export is available.
                  is_read: false
                  created_at: '2026-10-03T09:00:00+00:00'
        '401':
          description: 'Authentication failed: the `Authorization` header is missing; the tenant access
            token is invalid, expired, has no Keycloak issuer realm or does not identify a user; the tenant
            API key is invalid, disabled or revoked; the user does not exist in the tenant; or a Console
            session must first be confirmed with a one-time code (`detail.challenge` is `totp_required`).'
          content:
            application/json:
              examples:
                missing_credentials:
                  summary: No Authorization header
                  value:
                    detail: Bearer token or API key required.
                invalid_token:
                  summary: Invalid or expired access token
                  value:
                    detail: Invalid or expired tenant token.
                invalid_api_key:
                  summary: Unknown or malformed API key
                  value:
                    detail: Invalid tenant API key.
                revoked_api_key:
                  summary: Disabled or revoked API key
                  value:
                    detail: Tenant API key is disabled or revoked.
                totp_required:
                  summary: Console session needs a one-time code
                  value:
                    detail:
                      challenge: totp_required
                      message: Sign in with your one-time code to continue.
                      mfa_required: true
                      supported_methods:
                      - totp
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '403':
          description: 'Access denied: the caller lacks the permission listed in `x-galene-permissions`
            (`Permission required: <permission>`), the tenant is not active, the tenant user is inactive,
            or the `X-Tenant` header does not match the tenant of the credential.'
          content:
            application/json:
              examples:
                permission_missing:
                  summary: Missing permission
                  value:
                    detail: 'Permission required: agent.update'
                tenant_inactive:
                  summary: Tenant is suspended or not yet active
                  value:
                    detail: Tenant is not active.
                user_inactive:
                  summary: Tenant user is disabled
                  value:
                    detail: Tenant user is inactive.
                tenant_header_mismatch:
                  summary: X-Tenant does not match the credential
                  value:
                    detail: Explicit tenant header does not match token realm.
              schema:
                $ref: '#/components/schemas/HTTPErrorResponse'
        '503':
          description: 'The tenant is temporarily unavailable: an embedding migration has put it in maintenance
            (sent with `Retry-After: 300`), or the Console MFA policy or session state could not be read.'
          content:
            application/json:
              example:
                detail: Tenant is in maintenance for embedding migration. Try again after completion.
              schema:
                $ref: '#/components/schemas/HTTPErrorResponse'
        '404':
          description: The authenticated tenant was not found.
          content:
            application/json:
              example:
                detail: Tenant not found.
              schema:
                $ref: '#/components/schemas/HTTPErrorResponse'
        '422':
          description: The request body or parameters failed validation. `detail` lists one entry per
            invalid value with its location (`loc`), message (`msg`), error `type` and the rejected `input`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - TenantBearer: []
      - TenantApiKey: []
      x-galene-audience: tenant-admin
      x-galene-permissions:
      - notification.list
      x-galene-roles: []
  /application-notifications/preferences/{deployment_id}:
    get:
      tags:
      - Application notifications
      summary: Read your application notification preferences
      description: 'Read the authenticated recipient''s internal/email delivery preferences for one deployment
        in the current tenant. When no preference record exists, both channels are enabled; the read does
        not create a record.


        Requires ordinary tenant user authentication and `notification.list`. A missing or foreign-tenant
        deployment returns 404.


        Applications cannot select a user ID or override these recipient-owned preferences. Enabled email
        preference does not configure SMTP: the application must also have a bound recipient grant and
        an available tenant SMTP broker. Authenticated SMTP configured before that broker requires a secure
        password re-save by an authorized tenant settings operator.'
      operationId: getApplicationNotificationPreferences
      parameters:
      - name: deployment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Application deployment UUID in the authenticated recipient's tenant.
          examples:
          - 5f0c8a52-7d3e-4b1a-9c2e-000000000002
          title: Deployment Id
        description: Application deployment UUID in the authenticated recipient's tenant.
      responses:
        '200':
          description: The current recipient's saved preferences, or enabled defaults.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationNotificationPreferencesResponse'
              example:
                deployment_id: 5f0c8a52-7d3e-4b1a-9c2e-000000000002
                internal_enabled: true
                email_enabled: true
        '401':
          description: 'Authentication failed: the `Authorization` header is missing; the tenant access
            token is invalid, expired, has no Keycloak issuer realm or does not identify a user; the tenant
            API key is invalid, disabled or revoked; the user does not exist in the tenant; or a Console
            session must first be confirmed with a one-time code (`detail.challenge` is `totp_required`).'
          content:
            application/json:
              examples:
                missing_credentials:
                  summary: No Authorization header
                  value:
                    detail: Bearer token or API key required.
                invalid_token:
                  summary: Invalid or expired access token
                  value:
                    detail: Invalid or expired tenant token.
                invalid_api_key:
                  summary: Unknown or malformed API key
                  value:
                    detail: Invalid tenant API key.
                revoked_api_key:
                  summary: Disabled or revoked API key
                  value:
                    detail: Tenant API key is disabled or revoked.
                totp_required:
                  summary: Console session needs a one-time code
                  value:
                    detail:
                      challenge: totp_required
                      message: Sign in with your one-time code to continue.
                      mfa_required: true
                      supported_methods:
                      - totp
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
        '403':
          description: 'Access denied: the caller lacks the permission listed in `x-galene-permissions`
            (`Permission required: <permission>`), the tenant is not active, the tenant user is inactive,
            or the `X-Tenant` header does not match the tenant of the credential.'
          content:
            application/json:
              examples:
                permission_missing:
                  summary: Missing permission
                  value:
                    detail: 'Permission required: agent.update'
                tenant_inactive:
                  summary: Tenant is suspended or not yet active
                  value:
                    detail: Tenant is not active.
                user_inactive:
                  summary: Tenant user is disabled
                  value:
                    detail: Tenant user is inactive.
                tenant_header_mismatch:
                  summary: X-Tenant does not match the credential
                  value:
                    detail: Explicit tenant header does not match token realm.
              schema:
                $ref: '#/components/schemas/HTTPErrorResponse'
        '503':
          description: 'The tenant is temporarily unavailable: an embedding migration has put it in maintenance
            (sent with `Retry-After: 300`), or the Console MFA policy or session state could not be read.'
          content:
            application/json:
              example:
                detail: Tenant is in maintenance for embedding migration. Try again after completion.
              schema:
                $ref: '#/components/schemas/HTTPErrorResponse'
        '404':
          description: The authenticated tenant was not found, or the deployment is missing/belongs to
            another tenant.
          content:
            application/json:
              example:
                detail:
                  code: deployment_not_found
                  message: Application deployment was not found
              schema:
                anyOf:
                - $ref: '#/components/schemas/HTTPErrorResponse'
                - $ref: '#/components/schemas/CodedHTTPErrorResponse'
                title: Response 404 Getapplicationnotificationpreferences
        '422':
          description: The request body or parameters failed validation. `detail` lists one entry per
            invalid value with its location (`loc`), message (`msg`), error `type` and the rejected `input`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail:
                - type: uuid_parsing
                  loc:
                  - path
                  - deployment_id
                  msg: 'Input should be a valid UUID, invalid character: found `n` at 1'
                  input: not-a-uuid
                  ctx:
                    error: 'invalid character: found `n` at 1'
      security:
      - TenantBearer: []
      - TenantApiKey: []
      x-galene-audience: tenant-admin
      x-galene-permissions:
      - notification.list
      x-galene-roles: []
    put:
      tags:
      - Application notifications
      summary: Set your application notification preferences
      description: 'Create or replace the authenticated recipient''s internal/email preferences for one
        tenant application deployment. Send both booleans; each controls whether this app may deliver
        through that channel.


        Requires ordinary tenant user authentication and `notification.read`. The deployment must belong
        to the authenticated tenant; applications cannot write another recipient''s preferences.


        The saved values are checked immediately before subsequent notification dispatch and cannot be
        overridden by send arguments. Repeating the same values leaves the same channel policy. Disabling
        a channel does not remove already delivered inbox records or undo accepted SMTP messages, and
        enabling email does not configure transport or prove mailbox delivery.'
