                title: Response 401 Artifact V1 Services Operations  Operation Id  Artifacts  Name  Get
        '403':
          description: The deployment/tenant is inactive; service, execution mode, component, grant revision
            or bound resource is no longer authorized; optional user delegation fails its tenant, application
            or resource ACL checks. The artifact may also be outside current bindings or its filesystem
            read access denied.
          content:
            application/json:
              example:
                detail:
                  code: artifact_access_denied
                  message: Artifact is outside current resource bindings.
              schema:
                anyOf:
                - $ref: '#/components/schemas/CodedHTTPErrorResponse'
                - $ref: '#/components/schemas/HTTPErrorResponse'
                title: Response 403 Artifact V1 Services Operations  Operation Id  Artifacts  Name  Get
        '404':
          description: The operation or requested snapshot is unavailable, or optional delegation names
            an unknown tenant.
          content:
            application/json:
              example:
                detail:
                  code: artifact_not_found
                  message: Artifact is unavailable.
              schema:
                anyOf:
                - $ref: '#/components/schemas/CodedHTTPErrorResponse'
                - $ref: '#/components/schemas/HTTPErrorResponse'
                title: Response 404 Artifact V1 Services Operations  Operation Id  Artifacts  Name  Get
        '503':
          description: Tenant storage authority is unavailable or the tenant is in embedding maintenance.
          content:
            application/json:
              example:
                detail:
                  code: tenant_storage_unavailable
                  message: Tenant storage authority is unavailable.
              schema:
                anyOf:
                - $ref: '#/components/schemas/CodedHTTPErrorResponse'
                - $ref: '#/components/schemas/HTTPErrorResponse'
                title: Response 503 Artifact V1 Services Operations  Operation Id  Artifacts  Name  Get
        '409':
          description: The operation has no succeeded artifact, or an approved service resource role is
            unbound.
          content:
            application/json:
              example:
                detail:
                  code: result_not_ready
                  message: Operation has no completed artifact.
              schema:
                $ref: '#/components/schemas/CodedHTTPErrorResponse'
        '413':
          description: The referenced file exceeds 8 MiB or the JSON snapshot exceeds 32 MiB.
          content:
            application/json:
              example:
                detail:
                  code: result_size_limit
                  message: Artifact exceeds the service byte limit.
              schema:
                $ref: '#/components/schemas/CodedHTTPErrorResponse'
        '422':
          description: Path parameters failed validation or the referenced filesystem path is not a file.
          content:
            application/json:
              example:
                detail:
                  code: invalid_arguments
                  message: A file path is required
              schema:
                anyOf:
                - $ref: '#/components/schemas/CodedHTTPErrorResponse'
                - $ref: '#/components/schemas/ValidationErrorResponse'
                title: Response 422 Artifact V1 Services Operations  Operation Id  Artifacts  Name  Get
        '502':
          description: Artifact storage could not complete the read.
          content:
            application/json:
              example:
                detail:
                  code: storage_unavailable
                  message: Artifact storage is unavailable.
              schema:
                $ref: '#/components/schemas/CodedHTTPErrorResponse'
      security:
