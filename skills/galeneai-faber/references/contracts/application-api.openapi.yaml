  securitySchemes:
    AppServiceBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Application access token obtained by exchanging the Core-injected backend/worker bootstrap
        credential in the JSON body of `POST /v1/services/token`. Send `Authorization: Bearer <access_token>`.
        Tokens expire after 300 seconds and are bound to the registered tenant, deployment, component
        and current grant revision. Revocation and deployment state are checked on each request. Optional
        user delegation uses the separate `X-Galene-User-Authorization` header and never replaces this
        required application credential.'
    ControlPlaneApiKey:
      type: apiKey
      in: header
      name: Authorization
      description: Control-plane API key created with `POST /controlplane/api-keys` (format `gln_cp_<16
        hex>_<secret>`). Send the header value `ApiKey <key>` (`Api-Key <key>` is also accepted); the
        same key sent as `Bearer <key>` is rejected with 401. The key acts with the control-plane administrator
        role.
    ControlPlaneBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by the control-plane Keycloak realm (`master` unless `CONTROLPLANE_KEYCLOAK_REALM`
        is set), obtained from `POST /public/controlplane/auth/login` and renewed with `POST /public/controlplane/auth/refresh`.
        Tokens from any other realm are rejected with 403.
    TenantApiKey:
      type: http
      scheme: bearer
      bearerFormat: gln_tenant_<tenant-slug>_<16 hex>_<secret>
      description: 'Personal tenant API key created with `POST /tenant/me/api-keys`. Send `Authorization:
        Bearer <key>`; `Authorization: ApiKey <key>` and `Authorization: Api-Key <key>` are also accepted.
        The key acts as the user who owns it, with that user''s permissions, and the tenant is resolved
        from the slug embedded in the key.'
    TenantBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Access token issued by the tenant''s Keycloak realm, obtained from `POST /public/tenants/{tenant_slug}/auth/login`
        (or the Console sign-in and SSO exchange endpoints) and renewed with `POST /public/tenants/{tenant_slug}/auth/refresh`.
        Send `Authorization: Bearer <access_token>`. The tenant is resolved from the token issuer realm.'
tags:
- name: Authentication
  description: Public sign-in, token refresh, sign-out, one-time-code and temporary-password challenges,
    SSO and first-time bootstrap for the Control Plane and for each tenant.
- name: Application jobs
  description: Inspect and explicitly approve or revoke your offline consent for application schedules.
- name: Application notifications
  description: Read your application notification inbox and configure delivery preferences.
- name: Tenant Applications
  description: Install and configure applications for the tenant and resolve which applications each user
    can open.
- name: Application Service Resources
  description: List tenant resources available for explicit application service bindings.
- name: Application services
  description: Exchange component credentials, inspect grants and submit or observe non-agentic service
    operations.
- name: Control Plane
  description: Platform bootstrap and runtime settings, the tenant lifecycle and the current operator's
    profile and one-time-code devices.
- name: Control Plane Applications
  description: Publish application packages and versions, manage their availability and deploy them to
    tenants.
- name: Control Plane Application Archive Imports
  description: Upload application image archives in parts and import them into the platform registry.
- name: Control Plane Registry Sources
  description: Register and verify container registry sources and manage their imported images.
