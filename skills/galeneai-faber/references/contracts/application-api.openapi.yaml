    CompleteApplicationArchiveUploadRequest:
      properties:
        archive_sha256:
          anyOf:
          - type: string
          - type: 'null'
          title: Archive Sha256
          description: 'Optional SHA-256 of the whole archive: 64 hex digits, optionally prefixed with
            `sha256:`. When set, the import fails if the staged archive has another checksum; when omitted,
            the worker records the checksum it computes.'
          examples:
          - a1b2c3d4e5f60718a1b2c3d4e5f60718a1b2c3d4e5f60718a1b2c3d4e5f60718
        archive_size_bytes:
          type: integer
          maximum: 21474836480.0
          exclusiveMinimum: 0.0
          title: Archive Size Bytes
          description: Total size of the archive in bytes (1 byte to 20 GiB); it must equal the size of
            the assembled upload.
          examples:
          - 157286400
        parts:
          items:
            additionalProperties:
              anyOf:
              - type: string
              - type: integer
            type: object
          type: array
          maxItems: 10000
          minItems: 1
          title: Parts
          description: 'Uploaded parts in S3 `CompleteMultipartUpload` form, in ascending part order:
            one `{"PartNumber": <n>, "ETag": "<etag>"}` object per part (1-10,000 parts), with the `ETag`
            header returned by each part upload.'
      type: object
      required:
      - archive_size_bytes
      - parts
      title: CompleteApplicationArchiveUploadRequest
      description: Assemble the uploaded parts and queue the import.
      examples:
      - archive_sha256: a1b2c3d4e5f60718a1b2c3d4e5f60718a1b2c3d4e5f60718a1b2c3d4e5f60718
        archive_size_bytes: 157286400
        parts:
        - ETag: '"0f343b0931126a20f133d67c2b018a3b"'
          PartNumber: 1
        - ETag: '"5d41402abc4b2a76b9719d911017c592"'
          PartNumber: 2
