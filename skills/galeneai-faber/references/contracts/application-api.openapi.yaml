  /controlplane/tenants/{tenant_id}/application-deployments/{deployment_id}/service-credentials/rotate:
    post:
      tags:
      - Application Service Resources
      summary: Rotate a tenant's application service credentials
      description: 'Rotate the selected tenant deployment''s Core-managed backend/worker bootstrap credentials
        and request its redeployment.


        Requires control-plane authentication and `controlplane.applications.deploy`. The deployment must
        belong to the selected tenant, have desired_status deployed and retain its immutable application
        version.


        The grant revision increments, invalidating old service tokens and stored operation/job authority.
        Managed secrets stay in Core and are injected during redeployment; the 200 response returns only
        the deployment ID and revision and does not establish runtime readiness. Repeating the call rotates
        again. Observe the existing deployment status through the Control Plane management API before
        using the refreshed runtime.'
      operationId: controlplane_rotate_controlplane_tenants__tenant_id__application_deployments__deployment_id__service_credentials_rotate_post
      parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Registered target tenant UUID selected from the Control Plane tenant catalog.
          examples:
          - 5f0c8a52-7d3e-4b1a-9c2e-000000000001
          title: Tenant Id
        description: Registered target tenant UUID selected from the Control Plane tenant catalog.
      - name: deployment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Tenant application deployment UUID whose Core-managed backend/worker service credentials
            will rotate.
          examples:
          - 5f0c8a52-7d3e-4b1a-9c2e-000000000002
          title: Deployment Id
        description: Tenant application deployment UUID whose Core-managed backend/worker service credentials
          will rotate.
      responses:
        '200':
          description: Managed credentials were rotated and redeployment was requested; runtime readiness
            must be observed separately.
          content:
