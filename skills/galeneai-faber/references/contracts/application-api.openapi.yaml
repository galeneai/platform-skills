    patch:
      tags:
      - Tenant Applications
      summary: Update an application deployment
      description: 'Change the version, configuration, environment, model selections, approved capabilities,
        permission bindings or desired state of a deployment. Omitted fields keep their current value.


        Requires the `application.update` permission.


        Changing the version, `config`, `env`, `model_bindings` or `approved_capabilities` revalidates
        the runtime configuration against the manifest (as on install) and requests a redeploy, which
        sets `desired_status` to `deployed` (a suspended deployment is resumed). `desired_status` is applied
        afterwards: `deployed` deploys or resumes the application, `suspended` stops it and `uninstalled`
        removes it. Bindings of the listed permission keys are replaced in tenant RBAC in the same request,
        permissions that the manifest no longer declares are removed, and an event is recorded.


        The runtime changes asynchronously: the response shows the requested state (`updating`, `installing`,
        `resuming`, `suspending` or `uninstalling`); poll `GET /tenant/applications/deployments/{deployment_id}`
        until the controller reports the final `status`.'
      operationId: update_deployment_tenant_applications_deployments__deployment_id__patch
      parameters:
      - name: deployment_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Id of the tenant's application deployment.
          title: Deployment Id
        description: Id of the tenant's application deployment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTenantApplicationDeploymentRequest'
      responses:
        '200':
          description: The deployment with the requested changes.
