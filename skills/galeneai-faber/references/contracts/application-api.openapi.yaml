      description: 'Request the uninstall of a deployment: it moves to `desired_status` `uninstalled`
        and `status` `uninstalling`, and an event is recorded.


        Requires the `application.uninstall` permission.


        The application controller removes the runtime asynchronously and reports `uninstalled`, after
        which the application''s tenant permissions are removed; poll `GET /tenant/applications/deployments/{deployment_id}`
        to follow it. Application databases are kept: those declared `retain_on_uninstall` become `retained`,
        the others `pending_drop`. The deployment record remains, and the package can be installed again
        with `POST /tenant/applications/deployments`.'
