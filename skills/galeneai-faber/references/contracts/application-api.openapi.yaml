  /v1/services/operations/{operation_id}/cancel:
    post:
      tags:
      - Application services
      summary: Request cancellation of a service operation
      description: Request cancellation for an operation owned by the current deployment, component and
        actor after rechecking its current grants and resource access. The returned cancel_requested flag
        is a request, not confirmation that execution stopped. Poll the operation until a terminal status.
        Repeated cancellation is safe; an already terminal operation is returned unchanged. Delegated
        operations require the same user identity.
      operationId: cancel_v1_services_operations__operation_id__cancel_post
      parameters:
      - name: operation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Owned operation UUID to cancel.
          examples:
          - 5f0c8a52-7d3e-4b1a-9c2e-000000000001
          title: Operation Id
        description: Owned operation UUID to cancel.
      - name: X-Galene-User-Authorization
        in: header
        required: false
        description: Optional `Bearer <tenant_user_access_token>` for an unexpired, active user in the
          application's tenant. User mode must be approved for the service. Execution intersects application
          grants with user permissions and resource ACLs. Read and cancel delegated operations with the
          same user identity; this header never replaces Authorization.
        schema:
          type: string
        example: Bearer eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.EXAMPLE.SIGNATURE
      - name: X-Galene-Trace-Id
        in: header
        required: false
        description: Optional trace UUID for correlation. An absent or invalid UUID is replaced by a generated
          trace ID.
        schema:
          type: string
        example: 5f0c8a52-7d3e-4b1a-9c2e-000000000004
      - name: X-Galene-Parent-Span-Id
        in: header
        required: false
        description: Optional parent span UUID. An invalid UUID is ignored.
        schema:
          type: string
        example: 5f0c8a52-7d3e-4b1a-9c2e-000000000006
      - name: X-Galene-Correlation-Id
        in: header
        required: false
        description: Optional caller correlation string retained with operation trace metadata.
        schema:
          type: string
        example: probe-example-001
      responses:
        '202':
          description: Current operation state after recording the cancellation request, or unchanged
            terminal state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationServiceOperationResponse'
              example:
                id: 5f0c8a52-7d3e-4b1a-9c2e-000000000001
                service: filesystem
                operation: write
                status: queued
                cancel_requested: true
                result: null
                error: null
                created_at: '2026-10-03T09:30:00Z'
                updated_at: '2026-10-03T09:30:00Z'
        '401':
          description: The application access token is missing, expired, revoked or has an old grant revision;
            optional user delegation is invalid or expired.
          content:
            application/json:
              example:
                detail:
                  code: application_token_required
                  message: Application access token is required.
              schema:
                anyOf:
                - $ref: '#/components/schemas/CodedHTTPErrorResponse'
                - $ref: '#/components/schemas/AuthErrorResponse'
                title: Response 401 Cancel V1 Services Operations  Operation Id  Cancel Post
        '403':
          description: The deployment/tenant is inactive; service, execution mode, component, grant revision
            or bound resource is no longer authorized; optional user delegation fails its tenant, application
            or resource ACL checks.
          content:
            application/json:
              example:
                detail:
                  code: service_not_granted
                  message: Service role is not approved for this application.
              schema:
                anyOf:
                - $ref: '#/components/schemas/CodedHTTPErrorResponse'
                - $ref: '#/components/schemas/HTTPErrorResponse'
                title: Response 403 Cancel V1 Services Operations  Operation Id  Cancel Post
        '404':
          description: The operation is outside this deployment, component or actor, or an optional delegated
            user credential names an unknown tenant.
          content:
            application/json:
              example:
                detail:
                  code: operation_not_found
                  message: Operation is unavailable.
              schema:
                anyOf:
                - $ref: '#/components/schemas/CodedHTTPErrorResponse'
                - $ref: '#/components/schemas/HTTPErrorResponse'
                title: Response 404 Cancel V1 Services Operations  Operation Id  Cancel Post
        '503':
          description: Tenant storage authority is unavailable or the tenant is in embedding maintenance.
          content:
            application/json:
              example:
                detail:
                  code: tenant_storage_unavailable
                  message: Tenant storage authority is unavailable.
              schema:
                anyOf:
                - $ref: '#/components/schemas/CodedHTTPErrorResponse'
                - $ref: '#/components/schemas/HTTPErrorResponse'
                title: Response 503 Cancel V1 Services Operations  Operation Id  Cancel Post
        '409':
          description: An approved service resource role has no current binding.
          content:
            application/json:
              example:
                detail:
                  code: resource_not_configured
                  message: Service resource role is not bound.
              schema:
                $ref: '#/components/schemas/CodedHTTPErrorResponse'
        '422':
          description: The request body or parameters failed validation. `detail` lists one entry per
            invalid value with its location (`loc`), message (`msg`), error `type` and the rejected `input`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail:
                - type: uuid_parsing
                  loc:
                  - path
                  - operation_id
                  msg: 'Input should be a valid UUID, invalid character: found `n` at 1'
                  input: not-a-uuid
                  ctx:
                    error: 'invalid character: found `n` at 1'
      security:
      - AppServiceBearer: []
      x-galene-audience: application
      x-galene-permissions: []
      x-galene-roles: []
      x-galene-user-delegation:
        header: X-Galene-User-Authorization
        required: false
  /v1/services/token:
    post:
      tags:
      - Application services
      summary: Exchange an application component credential
      description: 'Exchange the Core-injected backend/worker bootstrap credential in the JSON body for
        a bearer access token valid for 300 seconds. No Authorization header or user delegation is required
        for this exchange. Core resolves the tenant, deployment, component and current grant revision
        from the registered credential; clients cannot select these authorities. The credential, deployment
        and tenant must remain active. Renew by repeating this exchange. The response carries Cache-Control:
        no-store.'
      operationId: token_v1_services_token_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationServiceTokenRequest'
        required: true
      responses:
        '200':
          description: Application bearer token and lifetime; do not cache the credential response.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
              example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationServiceTokenResponse'
        '401':
          description: The bootstrap credential is invalid, inactive or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodedHTTPErrorResponse'
              example:
                detail:
                  code: invalid_application_credential
                  message: Application credential is invalid.
        '403':
          description: The registered application deployment or tenant is inactive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodedHTTPErrorResponse'
              example:
                detail:
                  code: application_inactive
                  message: Application deployment is not active.
        '503':
          description: Tenant storage authority is unavailable or embedding maintenance blocks access.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/CodedHTTPErrorResponse'
                - $ref: '#/components/schemas/HTTPErrorResponse'
                title: Response 503 Token V1 Services Token Post
              example:
                detail:
                  code: tenant_storage_unavailable
                  message: Tenant storage authority is unavailable.
        '422':
          description: The request body or parameters failed validation. `detail` lists one entry per
            invalid value with its location (`loc`), message (`msg`), error `type` and the rejected `input`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
              example:
                detail:
                - type: missing
                  loc:
                  - body
                  - bootstrap_token
                  msg: Field required
                  input: {}
      security: []
      x-galene-audience: application
      x-galene-permissions: []
      x-galene-roles: []
      x-galene-bootstrap-exchange:
        in: body
        name: bootstrap_token
        access_token_ttl_seconds: 300
        description: Exchange the Core-injected component credential; no bearer token is required for
          this exchange.
components:
  schemas:
    ApplicationActiveEmbeddingSpace:
      properties:
        space:
